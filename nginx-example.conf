#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }
#
# HTTPS（推荐，用 certbot 一条命令签发免费证书）:
#   yum install -y certbot python3-certbot-nginx   # CentOS/Alibaba Cloud Linux
#   certbot --nginx -d ai.example.com
#   签发后自动改写 80 -> 443，并自动续期
#
# 启用 HTTPS 后记得在服务器上设置环境变量（deploy.sh 里填 SITE_URL）:
#   SITE_URL=https://ai.example.com

# ---------- 说明 ----------
# · 不配 Nginx 也能用: 安全组放行 3000 端口后直接 http://IP:3000 访问
#   （但 80/443 + 域名 + HTTPS 对 SEO 和分享体验更好）
# · gzip 建议在 nginx.conf 的 http {} 里开启:
#   gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
