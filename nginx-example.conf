# ============================================================
# Nginx 反向代理配置示例 · AI 作品集（与已有 Java 服务共存）
#
# 放置位置（二选一）:
#   1. 追加到 /etc/nginx/nginx.conf 的 http {} 内
#   2. 存为 /etc/nginx/conf.d/ai-works.conf（server 均在 conf.d 下自动加载）
#
# 改完后执行: nginx -t && nginx -s reload
# ============================================================

# ---------- 方案 A：用子路径与 Java 服务共存（同一个 80 端口） ----------
# 访问 http://你的IP/ai/ 走本服务，其余走原来的 Java
server {
    listen 80;
    server_name _;

    # 上传图片最大 25m（与后端限制一致，必须大于前端压缩后的图片体积）
    client_max_body_size 25m;

    # AI 作品集
    location /ai/ {
        proxy_pass http://127.0.0.1:3000/;   # 末尾的 / 会去掉 /ai 前缀
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 你原来的 Java 服务（保持你现有的配置即可，示例放在根路径）
    # location / {
    #     proxy_pass http://127.0.0.1:8080;
    # }
}

# ---------- 方案 B：用独立域名/子域名（推荐，SEO 友好） ----------
