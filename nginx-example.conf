# HTTPS（推荐，用 certbot 一条命令签发免费证书）:
#   yum install -y certbot python3-certbot-nginx   # CentOS/Alibaba Cloud Linux
#   certbot --nginx -d ai.example.com
#   签发后自动改写 80 -> 443，并自动续期
#
# 启用 HTTPS 后记得在服务器上设置环境变量（deploy.sh 里填 SITE_URL）:
#   SITE_URL=https://ai.example.com

# ============================================================
# 传输压缩（P0-3）—— 放进 /etc/nginx/nginx.conf 的 http {} 里，全局生效
# ============================================================
# 现状：线上只有默认 gzip（comp_level 1、types 偏少），app.js 201K / style.css 84K。
#
# 为什么不用 gzip_static：
#   本项目所有请求都 proxy_pass 到 Node，gzip_static 只对「nginx 自己从磁盘读」的文件生效，
#   走反向代理时它是空转的。想用预压缩必须先让 nginx 直出静态文件（见下方方案 2）。
#
# 方案 1（推荐，零风险，改完 reload 即生效）：
#gzip on;
#gzip_vary on;                    # 让 CDN / 代理按 Accept-Encoding 分别缓存
#gzip_proxied any;
#gzip_comp_level 6;               # 1 -> 6：体积再降 8~12%，CPU 开销可忽略
#gzip_min_length 1024;            # 小于 1K 压了反而变大
#gzip_types
#    text/plain text/css text/xml
#    application/javascript application/json application/xml
#    image/svg+xml application/manifest+json;
#
# 可选：装了 brotli 模块（ngx_brotli）再开这一段，比 gzip 再小 ~15%
#   实测 app.js gzip 201K -> brotli(q5) 170K，style.css 84K -> 73K
#brotli on;
#brotli_comp_level 5;
#brotli_types text/plain text/css application/javascript application/json image/svg+xml;
#
# 方案 2（进阶，想省 Node CPU 再上）：
#   把纯静态资源交给 nginx 直出，配合 gzip_static 免掉每次动态压缩。
#   注意：静态文件不再经过 Node，若日后在 Node 里对 js/css 做了特殊处理（如注入版本号），
#   必须同步改这里，否则会拿到旧内容。
#location ~* ^/(app|icons|mascots|qr-guard|sharecard|invite-card)\.js$|^/style\.css$ {
#    root /opt/ai-works-site/frontend;
#    gzip_static on;
#    expires 1y;
#    add_header Cache-Control "public, max-age=31536000, immutable";
#    try_files $uri =404;
#}
#
# 改完验证：
#   nginx -t && nginx -s reload
#   curl -sI -H 'Accept-Encoding: gzip' https://idea.v5pc.com/app.js | grep -i content-encoding
#   curl -sI -H 'Accept-Encoding: br'   https://idea.v5pc.com/app.js | grep -i content-encoding

# ---------- 说明 ----------
# · 不配 Nginx 也能用: 安全组放行 3000 端口后直接 http://IP:3000 访问
#   （但 80/443 + 域名 + HTTPS 对 SEO 和分享体验更好）
