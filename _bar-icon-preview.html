<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>吧台 icon 预览</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f7f7fb; padding: 40px; }
  .bar-tabs { display: flex; gap: 10px; align-items: center; }
  .bar-tab {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid #e4e2f2; background: #fff; color: #6a6f8a;
    border-radius: 999px; padding: 7px 16px; font-size: 13.5px; cursor: pointer;
  }
  .bar-tab.is-on { background: #f1eeff; border-color: #ddd6ff; color: #5b5bd6; font-weight: 600; }
  .bar-tab .ico { font-size: 13px; display: inline-flex; }
  .bar-tab .ico svg { width: 1em; height: 1em; }
  .zoom { margin-top: 24px; display: flex; gap: 28px; align-items: center; }
  .zoom .ico svg { width: 64px; height: 64px; color: #5b5bd6; }
  label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; text-align: center; }
</style>
</head>
<body>
  <div class="bar-tabs">
    <button class="bar-tab is-on" type="button"><i class="ico" data-ico="chat"></i> 散座 · 随便聊</button>
    <button class="bar-tab" type="button"><i class="ico" data-ico="bar"></i> 吧台 · 说出想要的</button>
  </div>
  <div class="zoom">
    <div><label>新·吧台 (64px)</label><i class="ico" data-ico="bar"></i></div>
    <div><label>旧·碰杯 wish</label><i class="ico" data-ico="wish"></i></div>
    <div><label>散座 chat</label><i class="ico" data-ico="chat"></i></div>
  </div>
  <script src="frontend/icons.js"></script>
  <script>Icons.hydrate();</script>
</body>
</html>
