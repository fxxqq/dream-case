<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>管理后台 · 造梦橱窗</title>
  <style>
    :root { --bg:#f6f7fb; --card:#fff; --text:#1f2330; --muted:#7a8095; --primary:#5b5bd6; --border:#e6e8f0; --danger:#e5484d; --ok:#2f9e44; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:1200px; margin:0 auto; padding:0 20px 60px; }
    header { background:#fff; border-bottom:1px solid var(--border); }
    .header-inner { display:flex; align-items:center; gap:16px; height:60px; max-width:1200px; margin:0 auto; padding:0 20px; }
    .logo { font-weight:700; color:var(--primary); font-size:17px; }
    .spacer { flex:1; }
    /* 顶部 PV/UV 横幅：进入后台一眼看到站点流量 */
    .pv-banner { display:flex; align-items:center; gap:14px; font-size:13px; color:var(--muted); }
    .pv-banner b { color:var(--text); font-size:15px; font-variant-numeric: tabular-nums; }
    .pv-banner .pv-item { white-space:nowrap; }
    .pv-banner .pv-item em { font-style:normal; font-size:11px; color:var(--muted); margin-right:3px; }
    @media (max-width: 900px) { .pv-banner { display:none; } }
    .btn { border:none; border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-ghost { background:#fff; border:1px solid var(--border); color:var(--text); }
    .btn-danger { background:#fff0f1; color:var(--danger); border:1px solid #f6c6c8; }
    .btn-ok { background:#e7f8ec; color:var(--ok); border:1px solid #bfe8ca; }
    .btn-sm { padding:5px 10px; font-size:12px; }

    .login { max-width:360px; margin:120px auto; background:#fff; padding:32px; border-radius:16px; border:1px solid var(--border); }
    .login h1 { font-size:18px; margin-bottom:6px; }
    .login p { color:var(--muted); font-size:13px; margin-bottom:20px; }
    .login input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:12px; font-size:14px; background:#fafafe; }
    .login input[type=checkbox] { width:auto; margin:0; accent-color:#5b5bd6; }
    .login .remember { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); margin:-2px 0 16px; cursor:pointer; user-select:none; }

    .stats { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
    .stat { background:#fff; border:1px solid var(--border); border-radius:8px; padding:6px 14px; display:flex; align-items:baseline; gap:6px; }
    .stat b { font-size:16px; }
    .stat span { color:var(--muted); font-size:12px; }

    .tabs { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
    .tab { padding:8px 18px; border-radius:999px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:14px; }
    .tab.active { background:#1f2330; border-color:#1f2330; color:#fff; }
    .tab-badge {
      display:inline-block; margin-left:7px; padding:1px 7px; border-radius:999px;
      background:#e5484d; color:#fff; font-size:11px; line-height:1.5; font-weight:600;
      vertical-align:1px;
    }

    .panel { background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; }
    .row { display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid var(--border); }
    .row:last-child { border-bottom:none; }
    .row img { width:72px; height:54px; object-fit:cover; border-radius:8px; background:#eceef5; }
    .row-main { flex:1; min-width:0; }
    .row-title { font-weight:600; font-size:14px; margin-bottom:4px; }
    .row-meta { font-size:12px; color:var(--muted); }
    .row-meta .pvuv { color:#5b5bd6; font-variant-numeric:tabular-nums; cursor:help; }
    .row-meta .row-link { color:#5b5bd6; word-break:break-all; }
    .row-meta .row-link.repo { color:#0a7d43; }
    .row-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:#eeeefc; color:var(--primary); margin-left:6px; }
    .tag.warn { background:#fff7e6; color:#d48806; }
    .tag.bad { background:#fff0f1; color:var(--danger); }
    .tag.ok { background:#e7f8ec; color:var(--ok); }
    .empty { padding:40px; text-align:center; color:var(--muted); font-size:14px; }
    .form-inline { display:flex; gap:10px; padding:16px 18px; flex-wrap:wrap; }
    .form-inline input { flex:1; min-width:140px; padding:9px 12px; border:1px solid var(--border); border-radius:10px; font-size:13px; background:#fafafe; }
    .hint { padding:0 18px 16px; color:var(--muted); font-size:12px; }

    /* 作品编辑弹窗 */
    .modal-mask { position:fixed; inset:0; background:rgba(20,22,30,.45); display:none; align-items:center; justify-content:center; z-index:60; padding:20px; }
    .modal { background:#fff; border-radius:16px; width:100%; max-width:640px; max-height:90vh; overflow:auto; padding:24px; }
    .modal h2 { font-size:17px; margin-bottom:16px; }
    .field { margin-bottom:14px; }
    .field > label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
    .field input, .field select, .field textarea {
      width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px;
      font-size:14px; background:#fafafe; font-family:inherit; color:var(--text);
    }
    .field textarea { resize:vertical; }
    .field input[type="file"] { padding:8px; font-size:13px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    /* ---- 与前台投稿弹窗统一的控件（胶囊单选 / 拖拽上传 / 预览网格） ---- */
    .form-hint { font-size:12px; color:var(--muted); background:#f7f7fb; border-radius:8px; padding:8px 10px; margin:2px 0 14px; }
    .os-picker { display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 4px; }
    .os-picker .os-opt { display:inline-flex; align-items:center; position:relative; margin:0; font-size:13px; font-weight:500; cursor:pointer; }
    .os-picker .os-opt input { position:absolute; opacity:0; width:0; height:0; pointer-events:none; }
    .os-picker .os-opt span {
      display:inline-flex; align-items:center; gap:4px; padding:7px 14px;
      border:1.5px solid var(--border); border-radius:999px; background:#fff; color:#4a4f5e;
      transition:background .15s, color .15s, border-color .15s, transform .15s;
      user-select:none; white-space:nowrap;
    }
    .os-picker .os-opt:hover span { border-color:#b9bbf0; transform:translateY(-1px); }
    .os-picker .os-opt input:checked + span { background:#eeeefc; border-color:var(--primary); color:var(--primary); font-weight:600; }
    .upload-dropzone {
      display:flex; align-items:center; gap:12px; border:2px dashed var(--border);
      border-radius:12px; padding:16px; cursor:pointer; background:#fafbff;
      transition:border-color .15s, background .15s, transform .1s;
    }
    .upload-dropzone:hover { border-color:var(--primary); background:#f3f3ff; }
    .upload-dropzone:active { transform:scale(.99); }
    .upload-dropzone input[type="file"] { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; clip:rect(0 0 0 0); }
    .upload-dropzone .dropzone-icon {
      flex:none; width:42px; height:42px; display:flex; align-items:center; justify-content:center;
      font-size:20px; border-radius:10px; background:#eef0fb; color:var(--primary);
    }
    .upload-dropzone:hover .dropzone-icon { background:var(--primary); color:#fff; }
    .upload-dropzone .dropzone-text { color:var(--muted); font-size:13.5px; line-height:1.5; }
    .upload-dropzone .dropzone-text small { color:#a0a3b5; }
    .upload-dropzone.small { padding:12px; }
    .upload-dropzone.small .dropzone-icon { width:34px; height:34px; font-size:16px; }
    .upload-dropzone.paste-active { border-color:var(--primary); background:#f3f3ff; }
    .upload-dropzone.paste-active::after {
      content:'Ctrl+V'; margin-left:auto; flex:none; font-size:11px; color:var(--primary);
      background:#eef0fb; padding:3px 8px; border-radius:999px;
    }
    .preview-box { margin-top:10px; position:relative; width:fit-content; max-width:100%; display:none; }
    .preview-box img { max-width:100%; border-radius:10px; max-height:200px; object-fit:contain; display:block; }
    .preview-box.mobile img { max-height:320px; }
    .preview-remove {
      position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
      border:none; cursor:pointer; background:rgba(20,20,30,.62); color:#fff;
      font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center;
      transition:background .15s, transform .1s;
    }
    .preview-remove:hover { background:#e5484d; transform:scale(1.06); }
    .gallery-previews { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px; margin-top:10px; }
    .gallery-previews:empty { display:none; }
    .gallery-thumb { position:relative; aspect-ratio:16/10; border-radius:8px; overflow:hidden; border:1px solid var(--border); cursor:grab; }
    .gallery-previews.mobile { grid-template-columns:repeat(auto-fill, minmax(64px, 1fr)); }
    .gallery-previews.mobile .gallery-thumb { aspect-ratio:9/16; }
    .gallery-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .gallery-thumb.dragging { opacity:.45; cursor:grabbing; }
    .gallery-thumb.drag-over { border-color:var(--primary); box-shadow:0 0 0 2px rgba(91,91,214,.35); }
    .gallery-order {
      position:absolute; top:4px; left:4px; min-width:16px; height:16px; padding:0 3px;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.55); color:#fff; font-size:10px; border-radius:8px; pointer-events:none;
    }
    .gallery-move {
      position:absolute; bottom:4px; width:18px; height:18px; border:none; border-radius:50%;
      background:rgba(0,0,0,.55); color:#fff; font-size:12px; line-height:1; cursor:pointer;
      display:flex; align-items:center; justify-content:center; opacity:.75;
    }
    .gallery-move:hover { background:var(--primary); opacity:1; }
    .gallery-move.prev { left:4px; }
    .gallery-move.next { right:4px; }
    .gallery-remove {
      position:absolute; top:4px; right:4px; width:20px; height:20px; border:none; border-radius:50%;
      background:rgba(0,0,0,.6); color:#fff; font-size:11px; line-height:1; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .gallery-remove:hover { background:#e03131; }
    .type-picker .type-opt.cat-add span { border-style:dashed; color:var(--muted); background:#fafafe; }
    .type-picker .type-opt.cat-add:hover span { border-color:var(--primary); color:var(--primary); }
    .type-picker .type-opt.cat-add span::after { content:none; }

    /* 作品形态多选（chip）：flex 不拉伸、✓ 占位常驻，选中不改变按钮宽高 */
    .type-picker { display:flex; flex-wrap:wrap; gap:6px; }
    .type-picker .type-opt { position:relative; display:inline-flex; align-items:center; cursor:pointer; flex:0 0 auto; }
    .type-picker .type-opt input { position:absolute; opacity:0; width:0; height:0; pointer-events:none; }
    .type-picker .type-opt span {
      display:inline-flex; align-items:center; justify-content:center; width:100%; gap:3px;
      padding:4px 8px; border:1.5px solid var(--border); border-radius:999px; background:#fff;
      color:#4a4f5e; font-size:12.5px; font-weight:500; white-space:nowrap;
      transition:background .15s,color .15s,border-color .15s,box-shadow .15s;
    }
    .type-picker .type-opt:hover span { border-color:#b9bbf0; }
    .type-picker .type-opt input:checked + span {
      background:var(--primary); border-color:var(--primary); color:#fff;
      box-shadow:0 3px 8px rgba(91,91,214,.24);
    }
    /* ✓ 的占位空间常驻保留（只切透明度），勾选不会改变按钮宽度，避免整行重排 */
    .type-picker .type-opt span::after {
      content:'✓'; font-size:11px; font-weight:700;
      display:inline-block; width:13px; text-align:center;
      opacity:0; transform:scale(.5);
      transition:opacity .15s, transform .15s;
    }
    .type-picker .type-opt input:checked + span::after { opacity:1; transform:scale(1); }
    /* 多形态时每个平台一行链接输入框 */
    .lpt-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .lpt-row:last-child { margin-bottom:0; }
    .lpt-row .lpt-name { flex:none; min-width:72px; font-size:12.5px; color:var(--muted); text-align:right; white-space:nowrap; }
    .lpt-row input { flex:1; min-width:0; }
    .cat-hint { margin:4px 0 0; font-size:12px; color:var(--muted); }
    #adminCatPicker { gap:7px; }
    #adminCatPicker .type-opt { flex:0 0 auto; }
    #adminCatPicker .type-opt span { width:auto; padding:5px 12px; font-size:12.5px; border-width:1px; font-weight:400; }
    .modal-foot { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
    .file-preview { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center; }
    .file-preview img { width:72px; height:72px; object-fit:cover; border-radius:8px; border:1px solid var(--border); display:block; }
    /* 缩略图 + 删除按钮 */
    .file-preview .thumb { position:relative; }
    .file-preview .thumb-del {
      position:absolute; top:-6px; right:-6px; width:20px; height:20px;
      border:none; border-radius:50%; background:rgba(20,20,30,.66); color:#fff;
      font-size:11px; line-height:1; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background .15s;
    }
    .file-preview .thumb-del:hover { background:#e5484d; }
    .file-preview .thumb-tip { font-size:11px; color:var(--muted); }
    /* 宣传图排序 */
    .file-preview .gal { cursor:grab; }
    .file-preview .gal.dragging { opacity:.45; cursor:grabbing; }
    .file-preview .gal.drag-over img { outline:2px solid #5b5bd6; outline-offset:1px; }
    .gal-order {
      position:absolute; top:2px; left:2px; min-width:16px; height:16px; padding:0 3px;
      display:flex; align-items:center; justify-content:center;
      background:rgba(20,20,30,.66); color:#fff; font-size:10px; border-radius:8px; pointer-events:none;
    }
    .gal-move {
      position:absolute; bottom:2px; width:18px; height:18px; border:none; border-radius:50%;
      background:rgba(20,20,30,.66); color:#fff; font-size:12px; line-height:1; cursor:pointer;
      display:flex; align-items:center; justify-content:center; transition:background .15s;
    }
    .gal-move:hover { background:#5b5bd6; }
    .gal-move.prev { left:2px; }
    .gal-move.next { right:2px; }
    /* 粘贴上传 */
    .file-row { display:flex; gap:8px; align-items:center; }
    .file-row input[type="file"] { flex:1; min-width:0; }
    .paste-mini {
      flex:none; display:inline-flex; align-items:center; gap:4px;
      padding:8px 12px; border:1px dashed var(--border); border-radius:10px;
      background:#fff; color:var(--muted); font-size:13px; font-family:inherit;
      cursor:pointer; transition:all .15s;
    }
    .paste-mini:hover { border-color:#5b5bd6; color:#5b5bd6; background:#f3f3ff; }
    .paste-mini.on { border-style:solid; border-color:#5b5bd6; color:#5b5bd6; background:#eef0fb; }
    .paste-tip { font-style:normal; font-size:11px; color:#a0a3b5; margin-left:6px; }
    .field.paste-active { background:#fbfbff; box-shadow: inset 3px 0 0 #5b5bd6; border-radius:6px; }
    @media (max-width:560px) { .grid2 { grid-template-columns:1fr; } }

    /* 广告位：按位置分组，组内一行一支广告 */
    .ad-group { border-bottom:1px solid var(--border); }
    .ad-group:last-child { border-bottom:none; }
    .ad-group-head { display:flex; align-items:flex-start; gap:12px; padding:14px 18px; background:#fbfbfe; }
    .ad-group-head .grow { flex:1; min-width:0; }
    .ad-group-name { font-weight:600; font-size:14px; }
    .ad-group-where { font-size:12px; color:var(--muted); margin-top:3px; }
    .ad-row { display:flex; align-items:center; gap:14px; padding:12px 18px; border-top:1px dashed var(--border); }
    .ad-thumb { width:120px; height:60px; border-radius:8px; object-fit:cover; background:#eceef5; flex:none; }
    .ad-thumb-none {
      width:120px; height:60px; border-radius:8px; flex:none;
      display:flex; align-items:center; justify-content:center;
      background:#f1f2f8; color:#a0a3b5; font-size:11px;
    }
    .ad-empty { padding:14px 18px; color:var(--muted); font-size:13px; border-top:1px dashed var(--border); }
    .ad-stat { font-variant-numeric:tabular-nums; }
    /* 刷新按钮：图标随请求旋转，请求结束就停 */
    #refreshBtn { display:none; align-items:center; gap:6px; }
    .refresh-ico { width:14px; height:14px; }
    #refreshBtn.show { display:inline-flex; }
    #refreshBtn.busy .refresh-ico { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <span class="logo">✦ 造梦橱窗 · 后台</span>
      <span class="pv-banner" id="pvBanner" style="display:none">
        <span class="pv-item"><em>今日</em><b id="pvToday">0</b> PV</span>
        <span class="pv-item"><em>今日</em><b id="uvToday">0</b> UV</span>
        <span class="pv-item"><em>累计</em><b id="pvTotal">0</b> PV</span>
        <span class="pv-item"><em>累计</em><b id="uvTotal">0</b> UV</span>
      </span>
      <a class="btn btn-ghost" href="/">返回网站</a>
      <span class="spacer"></span>
      <button class="btn btn-ghost" id="refreshBtn" title="刷新数据和当前列表">
        <svg class="refresh-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1.8v2.7h-2.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        刷新
      </button>
      <button class="btn btn-ghost" id="logoutBtn" style="display:none">退出</button>
    </div>
  </header>

  <div class="wrap">
    <div class="login" id="loginBox">
      <h1>管理员登录</h1>
      <p>请输入管理口令（服务端环境变量 ADMIN_KEY）</p>
      <input type="password" id="keyInput" placeholder="管理口令" />
      <label class="remember"><input type="checkbox" id="rememberKey" checked /> 在这台电脑上记住口令，下次免输</label>
      <button class="btn btn-primary" id="loginBtn" style="width:100%">进入后台</button>
    </div>

    <div id="adminBox" style="display:none">
      <div class="stats" id="stats"></div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="pending">待审核</button>
        <button class="tab" data-tab="all">全部作品</button>
        <button class="tab" data-tab="reports">投诉处理</button>
        <button class="tab" data-tab="claims">认领申请</button>
        <button class="tab" data-tab="feedback">意见反馈</button>
        <button class="tab" data-tab="comments">评论管理</button>
        <button class="tab" data-tab="ideas">想法墙</button>
        <button class="tab" data-tab="categories">分类管理</button>
        <button class="tab" data-tab="types">形态管理</button>
        <button class="tab" data-tab="tools">推荐位</button>
        <button class="tab" data-tab="ads">广告位</button>
        <button class="tab" data-tab="creators">认证创作者</button>
        <button class="tab" data-tab="points">送积分</button>
        <button class="tab" data-tab="friends">友情链接</button>
      </div>

      <div class="panel" id="panel"></div>
    </div>
  </div>

  <!-- 作品新建 / 编辑弹窗 -->
  <div class="modal-mask" id="editorMask">
    <div class="modal">
      <h2 id="editorTitle">新建作品</h2>
      <form id="workForm">
        <div class="field">
          <label>标题 *</label>
          <input name="title" required maxlength="100" placeholder="作品名称" />
        </div>
        <div class="grid2">
          <div class="field">
            <label>作者</label>
            <input name="author" maxlength="50" placeholder="默认：管理员" />
          </div>
          <div class="field">
            <label>状态</label>
            <select name="status">
              <option value="approved">已通过（立即展示）</option>
              <option value="pending">待审核</option>
              <option value="rejected">已拒绝</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>作品形态 *（可多选，比如既是网站又有小程序）</label>
          <div class="type-picker" id="adminTypePicker"></div>
        </div>
        <div class="field">
          <label>应用分类 *（可多选，最多 3 个）</label>
          <div class="type-picker" id="adminCatPicker"></div>
          <p class="cat-hint" id="adminCatHint">最多选择 3 个，第一个是主分类</p>
          <input type="text" id="adminNewCategory" maxlength="20"
                 placeholder="输入新分类名称，回车确认" style="display:none; margin-top:8px" />
        </div>
        <div class="field">
          <label>作品介绍 / 使用说明</label>
          <textarea name="prompt" rows="3" maxlength="1000"
                    placeholder="介绍一下：做什么用的、怎么体验、有什么亮点"></textarea>
        </div>
        <div class="field">
          <label>官网（选填，作品的主页 / 官方网站）</label>
          <input type="text" name="site" maxlength="500" placeholder="https://example.com" autocomplete="off" />
        </div>
        <div class="field">
          <label id="adminLinkLabel">链接（按形态必填 / 选填）</label>
          <div id="adminLinkInputs"></div><!-- 链接输入框由 JS 按所选形态渲染：单形态一个，多形态每个形态一个 -->
        </div>
        <div class="field" id="adminQrField" data-paste="qrcode">
          <label>小程序码 / 二维码 *</label>
          <label class="upload-dropzone small">
            <input type="file" name="qrcode" accept="image/*" />
            <span class="dropzone-icon">▦</span>
            <span class="dropzone-text">点击上传二维码图片<br /><small>或复制图片后按 Ctrl+V 粘贴</small></span>
          </label>
          <div class="preview-box" id="qrPreviewBox">
            <img id="qrPreviewImg" alt="二维码预览" />
            <button type="button" class="preview-remove" id="qrClear" title="删除二维码">✕</button>
          </div>
        </div>
        <div class="field" data-paste="image">
          <label>作品封面 / 截图 *</label>
          <label class="upload-dropzone">
            <input type="file" name="image" accept="image/*" />
            <span class="dropzone-icon">🖼️</span>
            <span class="dropzone-text" id="coverText">点击上传封面图<br /><small>支持 JPG / PNG / WebP，也可直接 Ctrl+V 粘贴截图</small></span>
          </label>
          <div class="preview-box" id="previewBox">
            <img id="previewImg" alt="封面预览" />
            <button type="button" class="preview-remove" id="coverClear" title="移除这张封面">✕</button>
          </div>
        </div>
        <div class="field" data-paste="images">
          <label>宣传图（选填，最多 9 张，展示在详情页）</label>
          <label class="upload-dropzone small">
            <input type="file" name="images" accept="image/*" multiple />
            <span class="dropzone-icon">+</span>
            <span class="dropzone-text" id="galleryText">添加宣传图片（复制图片后可直接 Ctrl+V 粘贴）</span>
          </label>
          <div class="gallery-previews" id="galleryPreviews"></div>
        </div>
        <div class="field">
          <label>是否开源</label>
          <div class="os-picker">
            <label class="os-opt"><input type="radio" name="openSource" value="" /><span>不标注</span></label>
            <label class="os-opt"><input type="radio" name="openSource" value="1" /><span>开源（代码公开）</span></label>
            <label class="os-opt"><input type="radio" name="openSource" value="0" /><span>闭源</span></label>
          </div>
        </div>
        <div class="field" id="repoField" style="display:none">
          <label>源码仓库地址 *</label>
          <input type="text" name="repo" maxlength="500" placeholder="https://github.com/用户名/仓库" />
        </div>
        <div class="field">
          <label>是否收费（选填）</label>
          <div class="os-picker">
            <label class="os-opt"><input type="radio" name="paid" value="" /><span>免费（不标注）</span></label>
            <label class="os-opt"><input type="radio" name="paid" value="1" /><span>💰 需要付费</span></label>
          </div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" id="cancelEdit">取消</button>
          <button type="submit" class="btn btn-primary" id="saveWorkBtn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 广告位：新建 / 编辑单支广告 -->
  <div class="modal-mask" id="adMask">
    <div class="modal">
      <h2 id="adFormTitle">挂一支广告</h2>
      <form id="adForm">
        <div class="field">
          <label>投放到哪个广告位 *</label>
          <select name="slot" id="adSlotSel"></select>
        </div>
        <div class="field">
          <label>广告形式 *</label>
          <select name="kind" id="adKindSel">
            <option value="image">图文 —— 图片铺底 + 标题文案（横幅广告）</option>
            <option value="text">纯文字 —— 浅色卡片，只用文字，不配图</option>
          </select>
          <div class="hint" style="padding:6px 0 0;font-size:12px">图文适合品牌曝光；纯文字更轻、加载更快，适合公告、规则、站内提醒。</div>
        </div>
        <div class="field">
          <label>标题 <span id="adTitleReq" style="color:#e5484d;display:none">*</span></label>
          <input name="title" maxlength="60" placeholder="例如：用 XX 一键做出小程序（图文形式标题和图片至少填一个）" />
        </div>
        <div class="field">
          <label>一句话描述（选填）</label>
          <input name="desc" maxlength="120" placeholder="补充卖点，展示在标题下方" />
        </div>
        <div class="field">
          <label>跳转链接 *</label>
          <input name="url" maxlength="500" placeholder="https://..." />
        </div>
        <div class="field">
          <label>按钮文字（选填）</label>
          <input name="cta" maxlength="20" placeholder="了解更多" />
        </div>
        <div class="field" id="adImageField">
          <label>横幅图片（选填，横图效果最好） <em class="paste-tip">建议 1400×280，2MB 内</em></label>
          <input type="file" name="image" accept="image/*" id="adImageInput" />
          <div class="file-preview" id="adImagePreview"></div>
        </div>
        <div class="field">
          <label>状态</label>
          <select name="active" id="adActiveSel">
            <option value="1">投放中</option>
            <option value="0">先停用（保存但不展示）</option>
          </select>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" id="adCancel">取消</button>
          <button type="submit" class="btn btn-primary" id="adSaveBtn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 口令保存：勾「记住」存 localStorage（关浏览器/换标签页都在），不勾只存 sessionStorage（关了就没）
    let KEY = '';
    try { KEY = localStorage.getItem('adminKey') || sessionStorage.getItem('adminKey') || ''; } catch { /* ignore */ }
    let currentTab = 'pending';
    const $ = id => document.getElementById(id);
    const panel = $('panel');

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const api = (path, opts = {}) => {
      const url = path + (path.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(KEY);
      return fetch(url, opts).then(async r => {
        const data = await r.json().catch(() => ({}));
        if (!r.ok) { const err = new Error(data.error || '请求失败'); err.status = r.status; throw err; }
        return data;
      });
    };
    const toast = msg => {
      let t = document.getElementById('t');
      if (!t) { t = document.createElement('div'); t.id = 't'; t.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1f2330;color:#fff;padding:10px 22px;border-radius:999px;font-size:14px;z-index:99'; document.body.appendChild(t); }
      t.textContent = msg; t.style.opacity = 1;
      clearTimeout(t._x); t._x = setTimeout(() => t.style.opacity = 0, 2000);
    };
    // 让打开着的前台页面静默刷新（改精选/置顶/审核/删除后不用手动刷新）
    const notifyCh = (() => { try { return ('BroadcastChannel' in window) ? new BroadcastChannel('dm-sync') : null; } catch { return null; } })();
    const notifySite = () => {
      try { if (notifyCh) notifyCh.postMessage('works-changed'); } catch { /* ignore */ }
      try { localStorage.setItem('dm_works_changed', String(Date.now())); } catch { /* ignore */ }
    };

    // ---- 登录 ----
    $('loginBtn').onclick = async () => {
      const key = $('keyInput').value.trim();
      if (!key) return toast('请输入口令');
      KEY = key;
      try {
        await api('/api/admin/stats');
        const keep = $('rememberKey') && $('rememberKey').checked;
        try {
          (keep ? localStorage : sessionStorage).setItem('adminKey', KEY);
          (keep ? sessionStorage : localStorage).removeItem('adminKey');   // 另一边别留旧口令
        } catch { /* ignore */ }
        enter();
      } catch (e) { toast(e.message || '口令错误'); }
    };
    // 刷新：统计卡片 + 当前标签内容一起重拉；请求中图标转圈且防重复点击
    $('refreshBtn').onclick = () => {
      const btn = $('refreshBtn');
      if (btn.classList.contains('busy')) return;
      btn.classList.add('busy');
      Promise.allSettled([loadStats(), renderTab(currentTab)]).finally(() => {
        btn.classList.remove('busy');
      });
    };

    $('logoutBtn').onclick = () => {
      try { localStorage.removeItem('adminKey'); } catch { /* ignore */ }
      try { sessionStorage.removeItem('adminKey'); } catch { /* ignore */ }
      location.reload();
    };

    function enter() {
      $('loginBox').style.display = 'none';
      $('adminBox').style.display = 'block';
      $('logoutBtn').style.display = 'inline-block';
      $('refreshBtn').classList.add('show');
      $('pvBanner').style.display = '';
      loadStats();
      renderTab(currentTab);
    }

    // 记住的口令失效了（比如服务端改过 ADMIN_KEY）→ 退回登录框
    function backToLogin(msg) {
      KEY = '';
      try { localStorage.removeItem('adminKey'); } catch { /* ignore */ }
      try { sessionStorage.removeItem('adminKey'); } catch { /* ignore */ }
      $('loginBox').style.display = 'block';
      $('adminBox').style.display = 'none';
      $('logoutBtn').style.display = 'none';
      $('refreshBtn').classList.remove('show', 'busy');
      if (msg) toast(msg);
    }

    async function loadStats() {
      try {
        const s = await api('/api/admin/stats');
        // 顶部 PV/UV 横幅（登录后常显，刷新数据时同步更新）
        $('pvToday').textContent = s.pvToday || 0;
        $('uvToday').textContent = s.uvToday || 0;
        $('pvTotal').textContent = s.pv || 0;
        $('uvTotal').textContent = s.uv || 0;
        $('stats').innerHTML = [
          ['注册用户', s.users || 0], ['今日新增', s.usersToday || 0], ['近 7 天新增', s.users7 || 0],
          ['作品总数', s.total], ['已通过', s.approved], ['待审核', s.pending],
          ['待处理投诉', s.reports], ['待看反馈', s.feedback], ['待审认领', s.claims || 0],
          ['今日 PV', s.pvToday || 0], ['今日 UV', s.uvToday || 0],
          ['累计 PV', s.pv || 0], ['累计 UV', s.uv || 0],
          ['总浏览', s.views], ['总点赞', s.likes]
        ].map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
        // 待处理数直接标在对应标签上，一眼看到哪里有活
        updateTabBadges({ pending: s.pending, reports: s.reports, claims: s.claims || 0, feedback: s.feedback });
      } catch (e) {
        if (e.status === 401 || e.status === 403) backToLogin('口令已失效，请重新输入');
        else toast(e.message);
      }
    }

    function updateTabBadges(map) {
      document.querySelectorAll('#tabs .tab').forEach(btn => {
        const key = btn.dataset.tab;
        const n = map[key];
        const old = btn.querySelector('.tab-badge');
        if (old) old.remove();
        if (typeof n === 'number' && n > 0) {
          const b = document.createElement('span');
          b.className = 'tab-badge';
          b.textContent = n > 99 ? '99+' : n;
          btn.appendChild(b);
        }
      });
    }

    // ---- Tab 切换 ----
    $('tabs').onclick = e => {
      const t = e.target.dataset.tab;
      if (!t) return;
      currentTab = t;
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
      renderTab(t);
    };

    function renderTab(tab) {
      panel.innerHTML = '<div class="empty">加载中…</div>';
      if (tab === 'pending') return loadWorks('pending');
      if (tab === 'all') return loadWorks('全部');
      if (tab === 'reports') return loadReports();
      if (tab === 'claims') return loadClaims();
      if (tab === 'feedback') return loadFeedback();
      if (tab === 'comments') return loadComments();
      if (tab === 'ideas') return loadIdeasAdmin();
      if (tab === 'categories') return loadCategories();
      if (tab === 'types') return loadTypes();
      if (tab === 'tools') return loadTools();
      if (tab === 'ads') return loadAds();
      if (tab === 'creators') return loadCreators();
      if (tab === 'points') return loadPoints();
      if (tab === 'friends') return loadFriends();
    }

    // ---- 作品 ----
    let WORK_CACHE = {};   // id → 作品（编辑用）
    let editingId = null;  // null = 新建

    let curStatus = '全部';   // 当前作品列表的筛选状态（原地改行时判断是否该移出列表）

    // 单行 HTML：loadWorks 与原地补丁共用，保证两种渲染完全一致
    // 链接缩略显示：去协议，超长截断，悬停 title 显示完整地址
    function shortUrl(u, max = 46) {
      let s = String(u || '').replace(/^https?:\/\//i, '').replace(/\/$/, '');
      return s.length > max ? s.slice(0, max - 1) + '…' : s;
    }
    function rowHtml(w) {
      return `
          <div class="row" data-row="${w.id}">
            <img src="${w.thumb}" alt="" />
            <div class="row-main">
              <div class="row-title">${esc(w.title)}
                <span class="tag">${esc((w.types && w.types.length ? w.types : [w.type || '网站']).join(' / '))}</span>
                ${w.status === 'pending' ? '<span class="tag warn">待审核</span>' : ''}
                ${w.anon ? '<span class="tag">匿名投稿</span>' : ''}
                ${w.anonymous ? '<span class="tag">匿名发布</span>' : ''}
                ${w.status === 'rejected' ? '<span class="tag bad">已拒绝</span>' : ''}
                ${w.featured ? '<span class="tag ok">精选</span>' : ''}
                ${w.pinned ? '<span class="tag">置顶</span>' : ''}
                ${w.openSource === true ? '<span class="tag ok">开源</span>' : w.openSource === false ? '<span class="tag">闭源</span>' : ''}
                ${w.paid ? '<span class="tag warn">付费</span>' : ''}
                ${w.claimable ? `<span class="tag warn" title="${w.claimed ? '已开放认领，审核通过会转移归属' : '无归属作品（匿名投稿 / 后台代传）默认可认领'}">可认领</span>` : ''}
              </div>
              <div class="row-meta">@${esc(w.author)}${w.anonymous && (w.authorReal || w.ownerReal) ? `（原提交：${esc(w.authorReal || '')}${w.ownerReal ? ' / @' + esc(w.ownerReal) : ''}）` : ''} · ${esc(w.category)} · ♥${w.likes} · 👁${w.views}
                · <span class="pvuv" title="今日 PV ${w.pvToday || 0} · UV ${w.uvToday || 0}">PV ${w.pv || 0} · UV ${w.uv || 0}</span>
                ${w.reports ? `· <span style="color:#e5484d">投诉 ${w.reports}</span>` : ''}
                ${w.link ? `· <a href="${esc(w.link)}" target="_blank" rel="noopener" class="row-link" title="${esc(w.link)}">${esc(shortUrl(w.link))}</a>` : ''}
                ${w.repo ? `· <a href="${esc(w.repo)}" target="_blank" rel="noopener" class="row-link repo" title="源码：${esc(w.repo)}">源码：${esc(shortUrl(w.repo, 30))}</a>` : ''}</div>
            </div>
            <div class="row-actions">
              <button class="btn btn-ghost btn-sm" data-act="edit" data-id="${w.id}">编辑</button>
              ${w.status !== 'approved' ? `<button class="btn btn-ok btn-sm" data-act="approve" data-id="${w.id}">通过</button>` : ''}
              ${w.status !== 'rejected' ? `<button class="btn btn-danger btn-sm" data-act="reject" data-id="${w.id}">拒绝</button>` : ''}
              <button class="btn btn-ghost btn-sm" data-act="feature" data-id="${w.id}">${w.featured ? '取消精选' : '设为精选'}</button>
              <button class="btn btn-ghost btn-sm" data-act="pin" data-id="${w.id}">${w.pinned ? '取消置顶' : '置顶'}</button>
              <button class="btn btn-ghost btn-sm" data-act="claimopen" data-id="${w.id}">${w.claimable ? '关闭认领' : '开放认领'}</button>
              <button class="btn btn-ghost btn-sm" data-act="anonymous" data-id="${w.id}">${w.anonymous ? '取消匿名' : '设为匿名'}</button>
              <button class="btn btn-ghost btn-sm" data-act="assign" data-id="${w.id}" title="把作品指定给站内某个账号名下">指定账号</button>
              <button class="btn btn-danger btn-sm" data-act="del" data-id="${w.id}">删除</button>
            </div>
          </div>`;
    }

    // 只替换这一行（或直接移除），不重渲染整个列表 → 页面不跳动、滚动位置不变
    function patchRow(id) {
      const el = panel.querySelector(`.row[data-row="${id}"]`);
      const w = WORK_CACHE[id];
      if (!el) return;
      const stay = w && (curStatus === '全部' || w.status === curStatus);
      if (!stay) { el.style.transition = 'opacity .2s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 200); return; }
      const tmp = document.createElement('div');
      tmp.innerHTML = rowHtml(w).trim();
      el.replaceWith(tmp.firstElementChild);
    }

    async function loadWorks(status) {
      curStatus = status;
      try {
        const list = await api('/api/admin/works?status=' + encodeURIComponent(status));
        list.forEach(w => { WORK_CACHE[w.id] = w; });
        const head = `<div class="form-inline" style="border-bottom:1px solid var(--border)">
            <button class="btn btn-primary" id="newWorkBtn">＋ 新建作品</button>
          </div>`;
        if (!list.length) { panel.innerHTML = head + '<div class="empty">暂无作品</div>'; return; }
        panel.innerHTML = head + list.map(rowHtml).join('');
      } catch (e) { panel.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
    }

    // ---- 新建 / 编辑弹窗 ----
    const editorMask = $('editorMask');
    const workForm = $('workForm');

    // 作品形态（多选）：形态清单由后台「形态管理」维护，这里动态渲染
    async function loadTypeOptions() {
      try {
        const meta = await fetch('/api/type-meta').then(r => r.json());
        const box = $('adminTypePicker');
        const cur = [...box.querySelectorAll('input[name="types"]:checked')].map(i => i.value);
        box.innerHTML = (Array.isArray(meta) ? meta : []).map((t, i) => {
          const on = cur.length ? cur.indexOf(t.name) !== -1 : i === 0;
          return `<label class="type-opt"><input type="checkbox" name="types" value="${esc(t.name)}"${on ? ' checked' : ''} /><span>${t.icon || '✨'} ${esc(t.name)}</span></label>`;
        }).join('');
      } catch {}
    }
    function adminSelectedTypes() {
      return [...workForm.querySelectorAll('input[name="types"]:checked')].map(i => i.value);
    }
    function adminSetTypes(list) {
      const want = (list || []).filter(Boolean);
      workForm.querySelectorAll('input[name="types"]').forEach(i => { i.checked = want.indexOf(i.value) !== -1; });
      if (!adminSelectedTypes().length) workForm.querySelector('input[name="types"]').checked = true;
      adminRenderLinkInputs();
    }

    // ---- 按形态的多个链接（多平台应用各填各的）----
    const ADMIN_LINK_PH = {
      'Web': 'https://你的网站地址', 'iOS': 'https://App Store / 下载页链接',
      'Android': 'https://下载页 / 应用商店链接', 'macOS': 'https://官网下载页 / 安装包链接',
      'Windows': 'https://官网下载页 / 安装包链接', 'Linux': 'https://官网下载页 / 安装包链接',
      '浏览器插件': 'https://Chrome / Edge 商店链接', '机器人': 'https://机器人对话页链接',
      'API': 'https://API 文档地址', '其他': 'https://...'
    };
    let adminPendingLinkValues = null; // 编辑回填时先暂存，渲染时消费
    function adminCollectLinks() {
      const out = {};
      workForm.querySelectorAll('input[data-ltype]').forEach(i => {
        const v = i.value.trim();
        if (v) out[i.dataset.ltype] = v;
      });
      return out;
    }
    function adminRenderLinkInputs() {
      const box = $('adminLinkInputs');
      if (!box) return;
      const allTypes = adminSelectedTypes();
      const types = allTypes.filter(t => t !== '小程序');
      // 与前台一致：只有选了「小程序」才显示二维码字段
      const needQr = allTypes.includes('小程序');
      $('adminQrField').style.display = needQr ? 'block' : 'none';
      $('adminLinkLabel').style.display = types.length ? 'block' : 'none';
      const prev = adminPendingLinkValues || adminCollectLinks();
      adminPendingLinkValues = null;
      if (!types.length) { box.innerHTML = ''; return; }
      if (types.length === 1) {
        $('adminLinkLabel').textContent = '链接（按形态必填 / 选填）';
        box.innerHTML = `<input name="link" data-ltype="${esc(types[0])}" maxlength="500" placeholder="${esc(ADMIN_LINK_PH[types[0]] || 'https://...')}" value="${esc(prev[types[0]] || '')}" />`;
      } else {
        $('adminLinkLabel').textContent = '各平台链接（选填，哪个平台有就填哪个）';
        box.innerHTML = types.map(t =>
          `<div class="lpt-row"><span class="lpt-name">${esc(t)}</span><input name="link_${esc(t)}" data-ltype="${esc(t)}" maxlength="500" placeholder="${esc(ADMIN_LINK_PH[t] || 'https://...')}" value="${esc(prev[t] || '')}" /></div>`).join('');
      }
    }

    // ---- 分类（多选，最多 3 个）----
    let adminCatList = [];
    function adminSelectedCats() {
      return [...document.querySelectorAll('#adminCatPicker input[name="cats"]:checked')].map(i => i.value);
    }
    function renderAdminCats(checked) {
      $('adminCatPicker').innerHTML = adminCatList.map(c =>
        `<label class="type-opt"><input type="checkbox" name="cats" value="${esc(c)}"${checked.includes(c) ? ' checked' : ''} /><span>${esc(c)}</span></label>`).join('')
        + `<button type="button" class="type-opt cat-add" id="adminCatAddBtn" title="创建并选择新分类"><span>＋ 新分类</span></button>`;
      const addBtn = $('adminCatAddBtn');
      if (addBtn) addBtn.onclick = e => {
        e.preventDefault();
        const inp = $('adminNewCategory');
        inp.style.display = 'block';
        inp.focus();
      };
      const n = adminSelectedCats().length;
      $('adminCatHint').textContent = n ? `已选 ${n}/3 个，第一个是主分类` : '最多选择 3 个，第一个是主分类';
    }
    function adminSetCats(list) {
      const want = (list || []).filter(c => adminCatList.includes(c)).slice(0, 3);
      renderAdminCats(want);
    }
    $('adminCatPicker').addEventListener('change', e => {
      if (e.target.name !== 'cats') return;
      if (adminSelectedCats().length > 3) {
        e.target.checked = false;
        toast('最多选择 3 个分类');
      }
      renderAdminCats(adminSelectedCats());
    });
    // 新分类：回车确认后先创建，再自动勾选（与前台投稿弹窗一致）
    {
      const inp = $('adminNewCategory');
      inp.addEventListener('keydown', async e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const name = inp.value.trim();
        if (!name) { inp.style.display = 'none'; return; }
        try {
          const r = await fetch('/api/categories', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
          });
          if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            if (err.error !== '分类已存在') { toast(err.error || '新增分类失败'); return; }
          }
          const sel = adminSelectedCats();
          adminCatList = ((await api('/api/categories')) || []).filter(c => c !== '全部');
          if (!adminCatList.includes(name)) adminCatList.push(name);
          const want = sel.includes(name) || sel.length >= 3 ? sel : [...sel, name];
          renderAdminCats(want.slice(0, 3));
          if (want.length > 3) toast('最多选择 3 个分类');
          inp.style.display = 'none';
          inp.value = '';
        } catch { toast('新增分类失败'); }
      });
      inp.addEventListener('blur', () => { if (!inp.value.trim()) inp.style.display = 'none'; });
    }
    // 开源 = 是 → 才需要填源码仓库
    workForm.querySelectorAll('input[name="openSource"]').forEach(r => {
      r.addEventListener('change', () => {
        $('repoField').style.display = getFormRadio('openSource') === '1' ? 'block' : 'none';
      });
    });
    // 勾选形态变化 → 重渲染链接输入框（每个所选形态一个）
    $('adminTypePicker').addEventListener('change', e => {
      if (e.target.name !== 'types') return;
      adminRenderLinkInputs();
    });
    async function loadCatOptions(selected) {
      try {
        adminCatList = ((await api('/api/categories')) || []).filter(c => c !== '全部');
      } catch { adminCatList = []; }
      renderAdminCats(Array.isArray(selected) ? selected.filter(c => adminCatList.includes(c)) : []);
    }

    // ---- 图片预览（带删除）----
    let existingCover = '';     // 编辑时的原封面
    let existingQr = '';        // 编辑时的原二维码
    let originalImages = [];    // 编辑时服务器上原有的宣传图
    let galItems = [];          // 有序宣传图：{kind:'old',url} | {kind:'new',file,src}
    let qrCleared = false;      // 二维码被手动删除

    // 原有但已从列表里删掉的宣传图
    const removedGallery = () => {
      const kept = galItems.filter(it => it.kind === 'old').map(it => it.url);
      return originalImages.filter(u => kept.indexOf(u) === -1);
    };

    const thumbHtml = (src, delAttr, extra = '') =>
      `<div class="thumb" ${extra}><img src="${src}" alt="" />${delAttr ? `<button type="button" class="thumb-del" ${delAttr} title="删除">✕</button>` : ''}</div>`;

    function setNewGallery(list) {
      try {
        const dt = new DataTransfer();
        list.forEach(f => dt.items.add(f));
        workForm.images.files = dt.files;
        return true;
      } catch (_) { return false; }
    }

    function keptExisting() {
      return galItems.filter(it => it.kind === 'old').map(it => it.url);
    }

    function renderGalleryPreview() {
      $('galleryPreviews').innerHTML = galItems.map((it, i) =>
        `<div class="gallery-thumb" draggable="true" data-index="${i}" title="拖动可调整顺序">
           <img src="${it.kind === 'old' ? it.url : it.src}" alt="" />
           <span class="gallery-order">${i + 1}</span>
           <button type="button" class="gallery-move prev" data-move="${i}:-1" title="前移">‹</button>
           <button type="button" class="gallery-move next" data-move="${i}:1" title="后移">›</button>
           <button type="button" class="gallery-remove" data-i="${i}" title="删除这张">✕</button>
         </div>`).join('');
      $('galleryText').innerHTML = galItems.length
        ? `已选 ${galItems.length}/9 张，点击继续添加`
        : '添加宣传图片（复制图片后可直接 Ctrl+V 粘贴）';
      $('galleryPreviews').querySelectorAll('.gallery-remove').forEach(btn => {
        btn.onclick = e => {
          e.preventDefault();
          const [it] = galItems.splice(+btn.dataset.i, 1);
          if (it && it.kind === 'new') URL.revokeObjectURL(it.src);
          syncGalleryInput();
          renderGalleryPreview();
        };
      });
      bindGalleryDrag();
    }

    function moveGal(from, to) {
      if (from === to || from < 0 || to < 0 || from >= galItems.length || to >= galItems.length) return;
      const [it] = galItems.splice(from, 1);
      galItems.splice(to, 0, it);
      renderGalleryPreview();
    }

    let galDragFrom = -1;
    function bindGalleryDrag() {
      const box = $('galleryPreviews');
      box.querySelectorAll('.gallery-thumb').forEach(el => {
        el.addEventListener('dragstart', e => {
          galDragFrom = +el.dataset.index;
          el.classList.add('dragging');
          try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(galDragFrom)); } catch (_) {}
        });
        el.addEventListener('dragend', () => {
          el.classList.remove('dragging');
          box.querySelectorAll('.gallery-thumb').forEach(x => x.classList.remove('drag-over'));
        });
        el.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if (+el.dataset.index !== galDragFrom) el.classList.add('drag-over');
        });
        el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
        el.addEventListener('drop', e => {
          e.preventDefault();
          el.classList.remove('drag-over');
          if (galDragFrom >= 0 && galDragFrom !== +el.dataset.index) moveGal(galDragFrom, +el.dataset.index);
        });
      });
      box.querySelectorAll('.gallery-move').forEach(btn => {
        btn.onclick = e => {
          e.preventDefault();
          const [i, d] = btn.dataset.move.split(':').map(Number);
          moveGal(i, i + d);
        };
      });
    }

    function setCoverDropText(html) {
      const el = $('coverText');
      if (el) el.innerHTML = html;
    }

    function renderCoverPreview() {
      const f = workForm.image.files[0];
      const box = $('previewBox');
      const src = f ? URL.createObjectURL(f) : (existingCover || '');
      box.style.display = src ? 'block' : 'none';
      if (src) $('previewImg').src = src; else $('previewImg').removeAttribute('src');
      setCoverDropText(f ? '已选择新封面，点击可更换<br /><small>也可直接 Ctrl+V 粘贴截图</small>'
        : (existingCover ? '保留原封面，点击可更换<br /><small>也可直接 Ctrl+V 粘贴截图</small>'
                         : '点击上传封面图<br /><small>支持 JPG / PNG / WebP，也可直接 Ctrl+V 粘贴截图</small>'));
    }

    function renderQrPreview() {
      const f = workForm.qrcode.files[0];
      const box = $('qrPreviewBox');
      const src = f ? URL.createObjectURL(f) : (qrCleared ? '' : (existingQr || ''));
      box.style.display = src ? 'block' : 'none';
      if (src) $('qrPreviewImg').src = src; else $('qrPreviewImg').removeAttribute('src');
    }

    // 封面 / 二维码的「✕ 删除」（静态按钮，只绑一次）
    $('coverClear').onclick = e => {
      e.preventDefault();
      workForm.image.value = '';
      renderCoverPreview();
    };
    $('qrClear').onclick = e => {
      e.preventDefault();
      workForm.qrcode.value = '';
      qrCleared = true;  // 提交时真正删除服务器上的二维码
      renderQrPreview();
      toast('已删除二维码');
    };

    // 把 galItems 里的新图同步回 file input（FormData / 旧逻辑兼容）
    function syncGalleryInput() {
      const news = galItems.filter(it => it.kind === 'new').map(it => it.file);
      setNewGallery(news);
    }

    // 单选胶囊（开源 / 收费）：RadioNodeList 直接赋值在部分浏览器不稳，统一走这里
    function setFormRadio(name, val) {
      const list = workForm.querySelectorAll(`input[name="${name}"]`);
      list.forEach(i => { i.checked = (i.value === (val || '')); });
      if (![...list].some(i => i.checked) && list.length) list[0].checked = true;
    }
    const getFormRadio = name => {
      const on = workForm.querySelector(`input[name="${name}"]:checked`);
      return on ? on.value : '';
    };

    async function openEditor(id) {
      editingId = id || null;
      workForm.reset();
      existingCover = ''; existingQr = ''; originalImages = []; galItems = []; qrCleared = false;
      setPasteTarget('image');
      const w = id ? WORK_CACHE[id] : null;
      $('editorTitle').textContent = w ? '编辑作品：' + w.title : '新建作品';
      $('galleryText').textContent = '添加宣传图片（复制图片后可直接 Ctrl+V 粘贴）';
      setCoverDropText(w ? '保留原封面，点击可更换<br /><small>也可直接 Ctrl+V 粘贴截图</small>'
                         : '点击上传封面图<br /><small>支持 JPG / PNG / WebP，也可直接 Ctrl+V 粘贴截图</small>');
      $('saveWorkBtn').textContent = w ? '保存修改' : '创建作品';
      await loadTypeOptions();
      await loadCatOptions(w ? (Array.isArray(w.categories) && w.categories.length ? w.categories : [w.category].filter(Boolean)) : []);
      setFormRadio('openSource', w && w.openSource === true ? '1' : (w && w.openSource === false ? '0' : ''));
      setFormRadio('paid', w && w.paid ? '1' : '');
      $('repoField').style.display = getFormRadio('openSource') === '1' ? 'block' : 'none';
      let draftRestored = false;
      if (!w) {
        draftRestored = restoreDraft(); // 新建模式恢复草稿（内部会渲染链接输入框）
        if (!draftRestored) adminRenderLinkInputs(); // 没草稿也要按默认形态渲染链接输入框
      }
      if (w) {
        workForm.title.value = w.title || '';
        workForm.author.value = w.author || '';
        adminSetTypes(w.types && w.types.length ? w.types : [w.type || '网站']);
        workForm.status.value = w.status || 'approved';
        workForm.repo.value = w.repo || '';
        {
          // 编辑回填：按形态的 links 优先，旧数据的单 link 落到第一个非小程序形态的输入框
          const nonMini = (w.types && w.types.length ? w.types : [w.type || 'Web']).filter(t => t !== '小程序');
          const pv = Object.assign({}, w.links || {});
          if (w.link && nonMini.length && !Object.keys(pv).length) pv[nonMini[0]] = w.link;
          adminPendingLinkValues = Object.keys(pv).length ? pv : null;
          adminRenderLinkInputs();
        }
        workForm.prompt.value = w.intro || '';
        workForm.site.value = w.site || ''; // 官网回填
        existingCover = w.image || '';
        existingQr = w.qrcode || '';
        originalImages = (w.images || []).slice();
        galItems = originalImages.map(u => ({ kind: 'old', url: u }));
      }
      renderCoverPreview();
      renderQrPreview();
      renderGalleryPreview();
      editorMask.style.display = 'flex';
      if (draftRestored) toast('已恢复上次未提交的草稿（图片需重新选择）');
      setTimeout(() => workForm.title.focus(), 50);
    }

    // ---- 关闭保护 + 草稿（新建模式）----
    const DRAFT_KEY = 'admin_work_draft';
    let draftTimer = null;
    function editorDirty() {
      if (['title', 'author', 'prompt'].some(k => workForm[k].value.trim())) return true;
      if (Object.keys(adminCollectLinks()).length) return true;
      if (workForm.image.files.length || workForm.qrcode.files.length) return true;
      if (galItems.length) return true;
      return false;
    }
    function saveDraft() {
      if (editingId) return; // 编辑模式不存草稿
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify({
          title: workForm.title.value, author: workForm.author.value,
          types: adminSelectedTypes(), cats: adminSelectedCats(),
          status: workForm.status.value, links: adminCollectLinks(),
          openSource: getFormRadio('openSource'),
          repo: workForm.repo.value,
          paid: getFormRadio('paid'),
          prompt: workForm.prompt.value, site: workForm.site.value, t: Date.now()
        }));
      } catch {}
    }
    function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch {} }
    function restoreDraft() {
      try {
        const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
        if (!d) return false;
        const hasLink = (d.links && Object.keys(d.links).length) || (d.link || '').trim();
        if (!['title', 'author', 'prompt'].some(k => (d[k] || '').trim()) && !hasLink) return false;
        workForm.title.value = d.title || '';
        workForm.author.value = d.author || '';
        adminSetTypes(Array.isArray(d.types) && d.types.length ? d.types : (d.type ? [d.type] : ['网站']));
        adminSetCats(Array.isArray(d.cats) && d.cats.length ? d.cats : (d.category ? [d.category] : []));
        if ([...workForm.status.options].some(o => o.value === d.status)) workForm.status.value = d.status;
        setFormRadio('openSource', ['', '1', '0'].includes(d.openSource) ? d.openSource : '');
        workForm.repo.value = d.repo || '';
        setFormRadio('paid', d.paid === '1' ? '1' : '');
        $('repoField').style.display = getFormRadio('openSource') === '1' ? 'block' : 'none';
        // 兼容旧草稿的单 link 字段
        if (d.links && Object.keys(d.links).length) adminPendingLinkValues = d.links;
        else if (d.link && d.link.trim()) {
          const t = ((d.types || []).filter(x => x !== '小程序')[0]) || 'Web';
          adminPendingLinkValues = { [t]: d.link.trim() };
        }
        adminRenderLinkInputs();
        workForm.prompt.value = d.prompt || '';
        workForm.site.value = d.site || '';
        return true;
      } catch { return false; }
    }
    workForm.addEventListener('input', () => { clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 400); });
    workForm.addEventListener('change', () => saveDraft());

    function tryCloseEditor() {
      if (!editingId && editorDirty()) {
        saveDraft();
        if (!confirm('内容还没提交，已自动存为草稿，下次打开「新建作品」会恢复（图片需重新选择）。确定关闭吗？')) return;
      }
      editorMask.style.display = 'none';
    }
    $('cancelEdit').onclick = tryCloseEditor;
    editorMask.onclick = e => { if (e.target === editorMask) tryCloseEditor(); };
    workForm.image.onchange = e => { renderCoverPreview(); };
    workForm.qrcode.onchange = e => {
      if (workForm.qrcode.files[0]) qrCleared = false;
      renderQrPreview();
    };
    workForm.images.onchange = e => {
      const files = [...e.target.files];
      for (const f of files) {
        if (!f.type || !f.type.startsWith('image/')) continue;
        if (galItems.length >= 9) { toast('最多 9 张宣传图'); break; }
        galItems.push({ kind: 'new', file: f, src: URL.createObjectURL(f) });
      }
      e.target.value = ''; // 清空，方便再次选择追加
      syncGalleryInput();
      renderGalleryPreview();
    };

    // ---- 粘贴上传（封面 / 二维码 / 宣传图）----
    let pasteTarget = 'image';

    function setPasteTarget(t) {
      pasteTarget = t;
      document.querySelectorAll('.upload-dropzone').forEach(el => {
        const f = el.closest('.field');
        el.classList.toggle('paste-active', !!(f && f.dataset.paste === t));
      });
    }

    function clipboardImage(cd) {
      if (!cd) return null;
      for (const it of [...(cd.items || [])]) {
        if (it.kind === 'file' && it.type && it.type.startsWith('image/')) {
          const f = it.getAsFile();
          if (f) return f;
        }
      }
      for (const f of [...(cd.files || [])]) if (f.type && f.type.startsWith('image/')) return f;
      return null;
    }

    function putFile(input, file) {
      try {
        const dt = new DataTransfer();
        dt.items.add(file);
        input.files = dt.files;
        input.onchange({ target: input });
        return true;
      } catch (_) { return false; }
    }

    function appendGallery(files) {
      let added = 0;
      for (const f of files) {
        if (!f.type || !f.type.startsWith('image/')) continue;
        if (galItems.length >= 9) { toast('最多 9 张宣传图'); break; }
        galItems.push({ kind: 'new', file: f, src: URL.createObjectURL(f) });
        added++;
      }
      if (!added) return;
      syncGalleryInput();
      renderGalleryPreview();
      toast(`已粘贴宣传图 ${galItems.length}/9`);
    }

    function applyPasted(target, file) {
      if (!file) return;
      // 二维码字段隐藏时（网站 / App 等形态）自动落到封面，与前台一致
      if (target === 'qrcode' && $('adminQrField').style.display === 'none') target = 'image';
      if (target === 'images') { appendGallery([file]); return; }
      const input = target === 'qrcode' ? workForm.qrcode : workForm.image;
      if (!putFile(input, file)) { toast('当前浏览器不支持粘贴，请点击选择文件'); return; }
      toast(target === 'qrcode' ? '已粘贴二维码' : '已粘贴封面');
    }

    document.querySelectorAll('.paste-mini').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.preventDefault();
        const t = btn.dataset.paste;
        setPasteTarget(t);
        if (!navigator.clipboard || !navigator.clipboard.read) { toast('请按 Ctrl+V 粘贴'); return; }
        try {
          const items = await navigator.clipboard.read();
          for (const item of items) {
            const type = item.types.find(x => x.startsWith('image/'));
            if (!type) continue;
            const blob = await item.getType(type);
            applyPasted(t, new File([blob], 'clipboard.png', { type }));
            return;
          }
          toast('剪贴板里没有图片，请先截图或复制图片');
        } catch (_) { toast('浏览器未授权读取剪贴板，请直接按 Ctrl+V'); }
      });
    });

    document.querySelectorAll('.field[data-paste]').forEach(f => {
      f.addEventListener('mouseenter', () => setPasteTarget(f.dataset.paste));
    });

    document.addEventListener('paste', e => {
      if (editorMask.style.display === 'none') return;
      const ae = document.activeElement;
      if (ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName) && ae.type !== 'file'
          && e.clipboardData && e.clipboardData.getData('text')) return;
      const file = clipboardImage(e.clipboardData);
      if (!file) return;
      e.preventDefault();
      applyPasted(pasteTarget, file);
    });

    workForm.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = $('saveWorkBtn');
      const oldText = btn.textContent;
      try {
        // 形态必填校验：只有网站需要链接，小程序需要二维码
        const pickedTypes = [...document.querySelectorAll('#adminTypePicker input:checked')].map(i => i.value);
        const pickedLinks = adminCollectLinks();
        if (pickedTypes.includes('Web') && !(pickedLinks.Web || '').trim()) {
          throw new Error('形态含「Web」，请填写网站地址');
        }
        if (pickedTypes.includes('小程序')) {
          const hasQr = workForm.qrcode.files.length > 0 || (existingQr && !qrCleared);
          if (!hasQr) throw new Error('形态含「小程序」，请上传小程序码 / 二维码');
        }

        const fd = new FormData(workForm);
        // 按形态的多个链接：统一走 links 字段，散的 link/link_xxx 不单独传
        Object.keys(pickedLinks).forEach(t => fd.delete('link_' + t));
        fd.delete('link');
        fd.set('links', JSON.stringify(pickedLinks));
        // 分类多选（最多 3 个），第一个是主分类；category 字段兼容老逻辑
        const pickedCats = adminSelectedCats();
        if (!pickedCats.length) throw new Error('请至少选择一个分类');
        fd.set('categories', JSON.stringify(pickedCats));
        fd.set('category', pickedCats[0]);
        if (!editingId && !workForm.image.files.length) throw new Error('请上传封面图');

        // 图片压缩（封面 1600 + 缩略图 520，宣传图 1600）
        const cover = workForm.image.files[0];
        if (cover) {
          const main = await shrink(cover, 1600, 0.85);
          const thumb = await shrink(cover, 960, 0.82);
          if (main) { fd.set('image', main, 'cover.jpg'); }
          if (thumb) { fd.set('thumb', thumb, 'thumb.jpg'); }
        }
        fd.delete('images');
        // 按界面顺序逐张压缩后追加（已有图不重传，用 imageOrder 告知最终顺序）
        const newFiles = galItems.filter(it => it.kind === 'new').map(it => it.file).slice(0, 9);
        for (let i = 0; i < newFiles.length; i++) {
          const g = await shrink(newFiles[i], 1600, 0.82);
          fd.append('images', g || newFiles[i], 'gallery-' + i + '.jpg');
        }
        if (galItems.length) {
          let n = -1;
          fd.set('imageOrder', JSON.stringify(galItems.map(it =>
            it.kind === 'old' ? it.url : `__new__${++n}`)));
        }

        // 编辑模式：保留已有宣传图、删除被标记的图片与二维码
        if (editingId) {
          fd.set('keepExisting', '1');
          const removed = removedGallery();
          if (removed.length) fd.set('removedImages', JSON.stringify(removed));
          if (!workForm.qrcode.files.length && qrCleared) fd.set('removeQrcode', '1');
        }

    // 用 canvas 压缩图片
    function shrink(file, maxSize, quality) {
      return new Promise(resolve => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(b => resolve(b), 'image/jpeg', quality);
        };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
      });
    }
