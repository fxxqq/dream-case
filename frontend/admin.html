        [urls[i], urls[j]] = [urls[j], urls[i]];
        try {
          await api('/api/admin/friends/reorder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ urls }) });
          loadFriends();
        } catch (err) { toast(err.message); }
        return;
      }
      const del = e.target.dataset.fdel;
      if (del) {
        if (!confirm('删除友情链接「' + del + '」？')) return;
        try {
          await api('/api/admin/friends/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: del }) });
          toast('已删除'); loadFriends();
        } catch (err) { toast(err.message); }
      }
    });

    // ---- 形态 ----
    let TYPE_ORDER = [];
    async function loadTypes() {
      try {
        const list = await api('/api/admin/types');
        TYPE_ORDER = list.map(t => t.name);
        panel.innerHTML = `
          <div class="form-inline">
            <input id="newTypeName" placeholder="新增形态名称，如：工具" maxlength="10" />
            <input id="newTypeIcon" placeholder="图标 emoji（选填）" maxlength="4" style="width:150px" />
            <button class="btn btn-primary" id="addTypeBtn">添加</button>
          </div>
          <div class="hint">形态决定投稿表单的选项、作品标签与前台筛选顺序；已有作品的形态不能直接删除，请先把作品改成其他形态。</div>
          ` + list.map((t, i) => `
            <div class="row">
              <div class="row-main">
                <div class="row-title">${t.icon || '✨'} ${esc(t.name)} <span class="tag">${t.count || 0} 件作品</span></div>
              </div>
              <div class="row-actions">
                <button class="btn btn-ghost btn-sm" data-tup="${esc(t.name)}" ${i === 0 ? 'disabled' : ''}>↑</button>
                <button class="btn btn-ghost btn-sm" data-tdown="${esc(t.name)}" ${i === list.length - 1 ? 'disabled' : ''}>↓</button>
                <button class="btn btn-danger btn-sm" data-tdel="${esc(t.name)}" ${t.name === '网站' ? 'disabled' : ''}>删除</button>
              </div>
            </div>`).join('');
      } catch (e) { panel.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
    }

    panel.addEventListener('click', async e => {
      if (e.target.id === 'addTypeBtn') {
        const name = $('newTypeName').value.trim();
        const icon = $('newTypeIcon').value.trim();
        if (!name) return toast('请输入形态名称');
        try {
          await api('/api/admin/types', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, icon })
          });
          toast('已添加形态'); loadTypes();
        } catch (err) { toast(err.message); }
      }
      const up = e.target.dataset.tup;
      const down = e.target.dataset.tdown;
      if (up || down) {
        const names = TYPE_ORDER.slice();
        const i = names.indexOf(up || down);
        const j = up ? i - 1 : i + 1;
        if (i < 0 || j < 0 || j >= names.length) return;
        [names[i], names[j]] = [names[j], names[i]];
        try {
          await api('/api/admin/types/reorder', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ names })
          });
          loadTypes();
        } catch (err) { toast(err.message); }
      }
      if (e.target.dataset.tdel) {
        const name = e.target.dataset.tdel;
        if (!confirm('删除形态「' + name + '」？')) return;
        try {
          await api('/api/admin/types/' + encodeURIComponent(name), { method: 'DELETE' });
          toast('已删除'); loadTypes();
        } catch (err) { toast(err.message); }
      }
    });

    // ---- 推荐位 ----
    async function loadTools() {
      try {
        const list = await api('/api/admin/tools');
        panel.innerHTML = `
          <div class="form-inline">
            <input id="toolName" placeholder="工具名称" maxlength="40" />
            <input id="toolDesc" placeholder="一句话描述" maxlength="120" />
            <input id="toolUrl" placeholder="https://..." />
            <button class="btn btn-primary" id="addToolBtn">添加</button>
          </div>
          <div class="hint">推荐位展示在作品详情页底部，适合放工具联盟 / 返佣链接</div>
          ` + (list.length ? list.map(t => `
            <div class="row">
              <div class="row-main">
                <div class="row-title">${esc(t.name)}</div>
                <div class="row-meta">${esc(t.desc || '')} · <a href="${esc(t.url)}" target="_blank" style="color:#5b5bd6">${esc(t.url)}</a></div>
              </div>
              <div class="row-actions"><button class="btn btn-danger btn-sm" data-tool="${t.id}">删除</button></div>
            </div>`).join('') : '<div class="empty">还没有推荐位</div>');
      } catch (e) { panel.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
    }

    panel.addEventListener('click', async e => {
      if (e.target.id === 'addToolBtn') {
        const name = $('toolName').value.trim();
        const url = $('toolUrl').value.trim();
        if (!name || !url) return toast('名称和链接必填');
        try {
          await api('/api/admin/tools', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, desc: $('toolDesc').value.trim(), url })
          });
          toast('已添加'); loadTools();
        } catch (err) { toast(err.message); }
      }
      if (e.target.dataset.tool) {
        try {
          await api('/api/admin/tools/' + e.target.dataset.tool, { method: 'DELETE' });
          toast('已删除'); loadTools();
        } catch (err) { toast(err.message); }
      }
    });

    // ---- 广告位 ----
    // 广告位（位置）写死在前端页面里，后台只负责往某个位置挂内容；
    // 同一位置挂多支时前台按这里的顺序轮流播放。
    let AD_SLOTS = [], AD_LIST = [], AD_EDIT = null, AD_IMG_REMOVED = false;

    const notifyAds = () => {
      try { if (notifyCh) notifyCh.postMessage('ads-changed'); } catch { /* ignore */ }
      try { localStorage.setItem('dm_ads_changed', String(Date.now())); } catch { /* ignore */ }
    };

    async function loadAds() {
      try {
        const data = await api('/api/admin/ads');
        AD_SLOTS = data.slots || [];
        AD_LIST = data.ads || [];
        panel.innerHTML = `
          <div class="hint" style="padding:16px 18px">
            广告位是页面里的固定空位：在这里挂上内容，前台对应位置就会显示；一个位置挂多支时自动轮流播放，
            没有广告的位置完全不占地方。<br />
            每条广告有两种形式：<b>图文</b>（图片铺底 + 标题文案，适合品牌曝光）、<b>纯文字</b>（浅色卡片只用文字，加载更快，适合公告/规则/站内提醒）。<br />
            PV = 被展示的次数（每次展示 +1）；UV = 去重访客（登录用户按账号、未登录按 IP，与站点 UV 口径一致）。
            点击率 = 点击 ÷ PV。<br />
            访客可以点广告右上角的 × 关掉不想看的广告：关掉后本地记住 90 天内不再出现，改了这条广告的文案或图片会重新出现。
            关闭不计入停用，也不影响统计口径。
          </div>
          ${AD_SLOTS.map(adGroupHtml).join('')}`;
      } catch (e) { panel.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
    }

    function adGroupHtml(s) {
      const list = AD_LIST.filter(a => a.slot === s.key);
      const pv = list.reduce((n, a) => n + ((a.stats && a.stats.pv) || 0), 0);
      return `<div class="ad-group">
        <div class="ad-group-head">
          <div class="grow">
            <div class="ad-group-name">${esc(s.name)}<span class="tag">${esc(s.key)}</span></div>
            <div class="ad-group-where">${esc(s.where)} · ${esc(s.size)} · 共 ${list.length} 支 · 本组累计 PV ${pv}</div>
          </div>
          <button class="btn btn-primary btn-sm" data-adnew="${esc(s.key)}">＋ 挂一条</button>
        </div>
        ${list.length ? list.map((a, i) => adRowHtml(a, i, list.length)).join('')
          : '<div class="ad-empty">还没有广告</div>'}
      </div>`;
    }

    function adRowHtml(a, i, total) {
      const on = a.active !== false;
      const st = a.stats || { pv: 0, uv: 0, todayPv: 0, todayUv: 0, clicks: 0, ctr: 0 };
      const isText = a.kind === 'text';
      return `<div class="ad-row" data-adrow="${a.id}">
        ${isText
          ? '<div class="ad-thumb-none">纯文字</div>'
          : (a.image ? `<img class="ad-thumb" src="${esc(a.image)}" alt="" />` : '<div class="ad-thumb-none">图文·未配图</div>')}
        <div class="row-main">
          <div class="row-title">${esc(a.title || '(无标题)')}
            <span class="tag">${isText ? '文字' : '图文'}</span>
            ${on ? '<span class="tag ok">展示中</span>' : '<span class="tag bad">已停用</span>'}
            ${total > 1 ? `<span class="tag">第 ${i + 1} 位</span>` : ''}
          </div>
          <div class="row-meta">${a.desc ? esc(a.desc) + ' · ' : ''}<a class="row-link" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(shortUrl(a.url))}</a></div>
          <div class="row-meta ad-stat">
            <span title="累计曝光次数">PV ${st.pv}</span> ·
            <span title="累计独立访客（登录按账号、未登录按 IP 去重）">UV ${st.uv}</span> ·
            今日 PV ${st.todayPv} / UV ${st.todayUv} ·
            点击 ${st.clicks} · 点击率 ${(st.ctr || 0).toFixed(1)}%
          </div>
        </div>
        <div class="row-actions">
          <button class="btn btn-ghost btn-sm" data-admove="up" data-id="${a.id}" ${i === 0 ? 'disabled' : ''} title="上移">↑</button>
          <button class="btn btn-ghost btn-sm" data-admove="down" data-id="${a.id}" ${i === total - 1 ? 'disabled' : ''} title="下移">↓</button>
          <button class="btn btn-ghost btn-sm" data-adedit="${a.id}">编辑</button>
          <button class="btn ${on ? 'btn-ghost' : 'btn-ok'} btn-sm" data-adtoggle="${a.id}">${on ? '停用' : '启用'}</button>
          <button class="btn btn-danger btn-sm" data-addel="${a.id}">删除</button>
        </div>
      </div>`;
    }

    function openAdEditor(id, slotKey) {
      const a = id ? AD_LIST.find(x => x.id === id) : null;
      AD_EDIT = a ? a.id : null;
      AD_IMG_REMOVED = false;
      $('adFormTitle').textContent = a ? '编辑广告' : '挂一支广告';
      $('adSlotSel').innerHTML = AD_SLOTS
        .map(s => `<option value="${esc(s.key)}">${esc(s.name)}</option>`).join('');
      $('adSlotSel').value = a ? a.slot : (slotKey || (AD_SLOTS[0] && AD_SLOTS[0].key) || '');
      const el = $('adForm').elements;
      el.kind.value = a ? (a.kind || (a.image ? 'image' : 'text')) : 'image';
      el.title.value = a ? (a.title || '') : '';
      el.desc.value = a ? (a.desc || '') : '';
      el.url.value = a ? (a.url || '') : '';
      el.cta.value = a ? (a.cta || '') : '';
      el.active.value = a && a.active === false ? '0' : '1';
      $('adImageInput').value = '';
      $('adImagePreview').innerHTML = a && a.image
        ? `<div class="thumb"><img src="${esc(a.image)}" alt="" /><button type="button" class="thumb-del" id="adImgDel" title="移除图片">✕</button></div>`
        : '';
      syncAdKind();
      $('adMask').style.display = 'flex';
    }

    // 纯文字形式：隐藏图片上传（已经传的图会被后端清掉）
    function syncAdKind() {
      const text = $('adKindSel').value === 'text';
      $('adImageField').style.display = text ? 'none' : '';
      $('adTitleReq').style.display = text ? 'inline' : 'none';
      if (text) { $('adImageInput').value = ''; $('adImagePreview').innerHTML = ''; }
    }
    $('adKindSel').onchange = syncAdKind;

    $('adImageInput').onchange = () => {
      const file = $('adImageInput').files[0];
      if (!file) return;
      AD_IMG_REMOVED = false;
      $('adImagePreview').innerHTML =
        `<div class="thumb"><img src="${URL.createObjectURL(file)}" alt="" /><button type="button" class="thumb-del" id="adImgDel" title="移除图片">✕</button></div>`;
    };
    $('adImagePreview').addEventListener('click', e => {
      if (e.target.id !== 'adImgDel') return;
      AD_IMG_REMOVED = true;
      $('adImageInput').value = '';
      $('adImagePreview').innerHTML = '';
    });
    $('adCancel').onclick = () => { $('adMask').style.display = 'none'; };
    $('adMask').onclick = e => { if (e.target === $('adMask')) $('adMask').style.display = 'none'; };

    $('adForm').onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData($('adForm'));
      if (AD_IMG_REMOVED) fd.set('removeImage', '1');
      const btn = $('adSaveBtn');
      btn.disabled = true;
      try {
        const data = await api('/api/admin/ads' + (AD_EDIT ? '/' + AD_EDIT : ''), {
          method: AD_EDIT ? 'PUT' : 'POST', body: fd
        });
        AD_SLOTS = data.slots; AD_LIST = data.ads;
        $('adMask').style.display = 'none';
        toast(AD_EDIT ? '已保存' : '已挂上');
        notifyAds();
        loadAds();
      } catch (err) { toast(err.message); }
      finally { btn.disabled = false; }
    };

    panel.addEventListener('click', async e => {
      const t = e.target;
      const id = t.dataset.id;
      if (t.dataset.adnew) return openAdEditor(null, t.dataset.adnew);
      if (t.dataset.adedit) return openAdEditor(t.dataset.adedit);
      try {
        if (t.dataset.admove) {
          const data = await api('/api/admin/ads/' + id + '/move', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dir: t.dataset.admove })
          });
          AD_LIST = data.ads; notifyAds(); return loadAds();
        }
        if (t.dataset.adtoggle) {
          const data = await api('/api/admin/ads/' + id + '/toggle', { method: 'POST' });
          AD_LIST = data.ads; notifyAds(); return loadAds();
        }
        if (t.dataset.addel) {
          const a = AD_LIST.find(x => x.id === id);
          if (!confirm('删除这条广告？删除后前台立即不再展示。')) return;
          const data = await api('/api/admin/ads/' + id, { method: 'DELETE' });
          AD_LIST = data.ads; notifyAds(); loadAds();
          toast('已删除');
        }
      } catch (err) { toast(err.message); }
    });

    // ---- 送积分 ----
    async function loadPoints() {
      try {
        const list = await api('/api/admin/users');
        panel.innerHTML = `
          <div class="form-inline">
            <input id="pointsSearch" placeholder="搜索账号或昵称…" />
          </div>
          <div class="hint">给用户加积分（用于兑换「站内推广」）；扣分填负数，扣到 0 为止。改动会记进对方账本。</div>
          <div id="pointsList">` + (list.length ? list.map(u => `
            <div class="row" data-uid="${esc(u.id)}">
              <div class="row-main">
                <div class="row-title">@${esc(u.name)} <span class="tag">${esc(u.username)}</span></div>
                <div class="row-meta">积分 <b class="pt-val">${u.points}</b> · ${u.works} 件作品 · ${esc((u.createdAt || '').slice(0, 10))}</div>
              </div>
              <div class="row-actions">
                <input class="pt-input" type="number" value="100" style="width:80px" />
                <button class="btn btn-primary btn-sm pt-give">送分</button>
                <button class="btn btn-danger btn-sm pt-take">扣分</button>
              </div>
            </div>`).join('') : '<div class="empty">没有匹配的用户</div>') + `</div>`;
        $('pointsSearch').oninput = e => {
          const q = e.target.value.trim().toLowerCase();
          panel.querySelectorAll('#pointsList .row').forEach(r => {
            r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
          });
        };
      } catch (e) { panel.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
    }

    panel.addEventListener('click', async e => {
      const give = e.target.classList.contains('pt-give');
      const take = e.target.classList.contains('pt-take');
      if (give || take) {
        const row = e.target.closest('.row');
        const uid = row.dataset.uid;
        const val = parseInt(row.querySelector('.pt-input').value, 10);
        if (!Number.isFinite(val) || val === 0) return toast('请输入非 0 整数');
        const delta = take ? -Math.abs(val) : Math.abs(val);
        const name = row.querySelector('.row-title').textContent.trim();
        if (take && !confirm(`确定从 ${name} 扣 ${Math.abs(val)} 分？`)) return;
        try {
          const r = await api('/api/admin/points', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: uid, delta })
          });
          row.querySelector('.pt-val').textContent = r.points;
          row.querySelector('.pt-input').value = 100;
          toast(`${r.name} ${delta > 0 ? '+' : ''}${delta} 分，现有 ${r.points} 分`);
        } catch (err) { toast(err.message); }
      }
    });

    // ---- 认证创作者 ----
    async function loadCreators() {
      try {
        const list = await api('/api/admin/creators');
        panel.innerHTML = `
          <div class="form-inline">
            <input id="creatorName" placeholder="作者昵称（与投稿时一致）" maxlength="50" />
            <input id="creatorBio" placeholder="简介（选填）" maxlength="200" />
            <button class="btn btn-primary" id="addCreatorBtn">认证</button>
          </div>
          <div class="hint">认证后该作者的作品会显示 ✔ 标识，作者主页也会显示认证徽章</div>
          ` + (list.length ? list.map(c => `
            <div class="row">
              <div class="row-main">
                <div class="row-title">@${esc(c.name)} <span class="tag ok">认证</span></div>
                <div class="row-meta">${esc(c.bio || '')}</div>
              </div>
              <div class="row-actions"><button class="btn btn-danger btn-sm" data-creator="${esc(c.name)}">取消认证</button></div>
            </div>`).join('') : '<div class="empty">还没有认证创作者</div>');
      } catch (e) { panel.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
    }

    panel.addEventListener('click', async e => {
      if (e.target.id === 'addCreatorBtn') {
        const name = $('creatorName').value.trim();
        if (!name) return toast('请输入作者昵称');
        try {
          await api('/api/admin/creators', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, bio: $('creatorBio').value.trim() })
          });
          toast('已认证'); loadCreators();
        } catch (err) { toast(err.message); }
      }
      if (e.target.dataset.creator) {
        try {
          await api('/api/admin/creators/' + encodeURIComponent(e.target.dataset.creator), { method: 'DELETE' });
          toast('已取消认证'); loadCreators();
        } catch (err) { toast(err.message); }
      }
    });

    // 自动登录：记住的口令先静默校验一次，有效直接进后台，无效（改过口令）退回登录框
    if (KEY) api('/api/admin/stats').then(enter).catch(() => backToLogin());
  </script>
</body>
</html>
