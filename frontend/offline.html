<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网络未连接 - 造梦橱窗</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(160deg, #f5f5ff, #fdf2f8); color: #1f2330; }
    .box { text-align: center; padding: 32px; max-width: 320px; }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 13px; color: #6b7280; line-height: 1.6; margin: 0 0 20px; }
    button { padding: 10px 28px; border: none; border-radius: 10px; cursor: pointer;
      background: #5b5bd6; color: #fff; font-size: 14px; }
    button:active { background: #4747c2; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>网络未连接</h1>
    <p>当前处于离线状态，恢复网络后再来看看大家的新作品吧。</p>
    <button onclick="location.reload()">重新加载</button>
  </div>
</body>
</html>
