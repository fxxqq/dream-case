<!doctype html>
<!-- 落笔成画：键入文字，墨自成景。接入自 https://github.com/ns2250225/ink （MIT License，
     字体 Ma Shan Zheng 为 SIL OFL 开源授权）。除本注释与 noindex 外未改任何逻辑。 -->
<!-- 独立静态页（与 /mascots /musicbox 同一路数）：不接 SPA、不进 sitemap，页面自带 noindex。 -->
<!-- 2026-11-23 站长改（均为交互不改画笔逻辑）：
     ① 去掉 #pen 输入框——不需要打字，直接点字；题诗按钮和 ?t= 参数仍走 typeText。
     ② chips 从 27 个字改成字库全集：遍历 M（def 注册的一字一景映射）去重后全部列出，
        引擎认得多少字就上多少字，以后 def 加字 chips 自动跟上。chips 区可滚动。
     ③ 「设为壁纸」：按钮在父页纸面右上角（app.js），本页只听 dm-paint-wall-req 指令——合成当前画
        → 缩到 ≤1920 宽 → 透明 WebP → postMessage 回父页（app.js 存 localStorage 铺全站背景）。
-->
<!-- 2026-11-25 站长改：
     ① 纸色跟站点主题走：父页开纸面时带 ?paper=#rrggbb（当前 --bg），纸/白纱/暗角全部对齐站点底色。
     ② 壁纸改「透明墨层」：导出按纸色亮度差算 alpha，存 WebP（带透明），站点底色和主题光透上来。
     ③ 新增 AI 题诗：底部输入 ≤10 字，服务端 /api/paint/poem 拼五言/七言绝句，逐句落墨。 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>落笔成画</title>
<meta name="robots" content="noindex">
<style>
@font-face{
  font-family:"Mo Brush";
  src:local("Ma Shan Zheng"),local("MaShanZheng-Regular"),url("fonts/MaShanZheng-Regular.ttf") format("truetype");
  font-display:swap;
}
:root{
  /* 纸色 = 站点底色（父页按当前主题传 ?paper=，JS 会覆盖这两个值）：
     纸和站内底色一致，纸面从 header 底下滑下来时没有白边，也不会比周围亮一档 */
  --paper:#f7f7fb; --paper-rgb:247,247,251; --ink:#1b1a18; --red:#b22c22;
  --brush:"Mo Brush","Xingkai SC","STXingkai","华文行楷","Kaiti SC","STKaiti","KaiTi","楷体",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none;cursor:crosshair}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .85s ease}
#far,#mid,#near,#text{mix-blend-mode:multiply}
#stage.fade canvas:not(#paper){opacity:0}

#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-bottom:14vh;pointer-events:none;transition:opacity 1.6s ease;z-index:5;text-align:center}
#intro.gone{opacity:0}
#intro h1{font:400 clamp(60px,12vw,160px)/1 var(--brush);color:rgba(27,26,24,.13);margin:0;letter-spacing:.1em;padding-left:.1em}
#intro p{font:clamp(15px,1.7vw,21px)/1.6 var(--brush);color:rgba(27,26,24,.46);letter-spacing:.32em;margin:26px 0 0;padding-left:.32em}
#intro p+p{margin-top:6px;color:rgba(27,26,24,.3);letter-spacing:.2em}

/* 换纸/题诗/存画（2026-11-24 站长：从左上角挪到右上，排在父页那组「设为壁纸/取消壁纸/收笔」左边）：
   右边留出 16 + 256 + 20 = 292px 给父页按钮组（「取消壁纸」露出时最宽，实测 256px），
   窄屏（≤560px）改排第二行免得挤出画布。 */
#tools{position:fixed;right:292px;left:auto;top:max(16px,2.2vh);display:flex;gap:6px;z-index:10}
#tools button,#chips button{font-family:var(--brush);background:none;border:0;cursor:pointer;color:rgba(27,26,24,.5);
  transition:color .25s,transform .25s;border-radius:4px}
#tools button{font-size:20px;padding:6px 10px;letter-spacing:.1em}
#tools button:hover,#chips button:hover{color:var(--ink)}
#tools button:hover{transform:translateY(-1px)}
#tools button:focus-visible,#chips button:focus-visible{outline:1.5px solid var(--red);outline-offset:1px}

#ui{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;
  align-items:center;gap:8px;z-index:10;pointer-events:none}
#ui::before{content:"";position:absolute;left:0;right:0;bottom:calc(-1 * max(16px,env(safe-area-inset-bottom)));height:150px;z-index:-1;
  background:linear-gradient(to top,rgba(var(--paper-rgb),.92),rgba(var(--paper-rgb),.62) 45%,rgba(var(--paper-rgb),0))}
#ui>*{pointer-events:auto}
/* AI 题诗（2026-11-25）：输入 ≤10 个字，五言/七言各一颗；和 chips 一样悬在纸底白纱上 */
#poemBar{display:flex;align-items:center;gap:2px;padding:3px 6px 3px 12px;border-radius:999px;
  background:rgba(var(--paper-rgb),.72);border:1px solid rgba(27,26,24,.1);box-shadow:0 4px 16px rgba(27,26,24,.06)}
#poemSeed{width:clamp(148px,24vw,220px);padding:2px 4px;border:0;background:none;outline:none;
  font:16px/1.5 var(--brush);color:var(--ink);text-align:center;letter-spacing:.04em}
#poemSeed::placeholder{color:rgba(27,26,24,.34);letter-spacing:.03em}
#poemBar button{font:16px/1 var(--brush);padding:5px 9px;letter-spacing:.06em}
#poemBar button:disabled{opacity:.42;cursor:default;transform:none}
#poemBar button:disabled:hover{color:rgba(27,26,24,.5)}
/* 题诗反馈（2026-11-25）：以前失败只改输入框 placeholder，框里有字就完全看不见，
   用户以为按钮坏了。改成输入条上方一条小字，成功自动收，失败停几秒。 */
#poemMsg{display:none;max-width:min(560px,92vw);padding:4px 14px;border-radius:999px;
  background:rgba(var(--paper-rgb),.86);border:1px solid rgba(179,53,46,.26);
  font:14px/1.45 var(--brush);color:#b3352e;letter-spacing:.03em;text-align:center}
#poemMsg.on{display:block}
#poemMsg.info{color:rgba(27,26,24,.62);border-color:rgba(27,26,24,.12)}
#chips{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;max-width:min(1100px,96vw);max-height:min(20vh,180px);overflow-y:auto;
  padding:0 10px;scrollbar-width:thin;scrollbar-color:rgba(27,26,24,.22) transparent;-webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{width:4px}
#chips::-webkit-scrollbar-thumb{background:rgba(27,26,24,.22);border-radius:2px}
#chips button{font-size:18px;padding:3px 6px}
#chips button:hover{transform:translateY(-2px) scale(1.3)}
@media (max-width:560px){
  #tools{right:16px;top:max(56px,2.2vh + 40px)}   /* 窄屏：父页按钮组下面另起一行，三者仍靠右 */
  #chips button{font-size:17px;padding:3px 5px}#tools button{font-size:18px;padding:6px 7px}
  #poemSeed{width:42vw;font-size:15px}
  #poemBar{padding:2px 4px 2px 10px}
  #chips{max-height:min(17vh,150px)}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="paper"></canvas>
  <canvas id="far"></canvas>
  <canvas id="mid"></canvas>
  <canvas id="near"></canvas>
  <canvas id="live"></canvas>
  <canvas id="text"></canvas>
</div>

<div id="intro">
  <h1>落笔成画</h1>
  <p>点一个字，墨自成景</p>
  <p>山 · 水 · 月 · 舟 · 竹 · 梅 · 雪 …… 字都在底下</p>
</div>

<div id="tools">
  <button id="btn-new" title="清空画面（Esc）">换纸</button>
  <button id="btn-poem" title="自动题一句古诗">题诗</button>
  <button id="btn-save" title="保存为图片">存画</button>
</div>

<div id="ui">
  <div id="poemMsg" role="status" aria-live="polite"></div>
  <div id="poemBar">
    <input id="poemSeed" type="text" maxlength="10" autocomplete="off" spellcheck="false"
      placeholder="输入 ≤10 字，AI 题成诗" aria-label="输入不超过十个字，让 AI 拼成一首五言或七言绝句">
    <button type="button" class="poem-go" data-form="5" title="拼成五言绝句">五言</button>
    <button type="button" class="poem-go" data-form="7" title="拼成七言绝句">七言</button>
  </div>
  <div id="chips" aria-label="点选一字入画"></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const {cos, sin, abs, min, max, pow, floor, ceil, round, hypot, atan2, PI} = Math;
const TAU = PI * 2;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => floor(rand(a, b + 1));
const pick = a => a[floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - pow(1 - t, 3);
const NT = new Float32Array(1024); for (let i = 0; i < 1024; i++) NT[i] = Math.random();
const n1 = x => { const i = floor(x), f = x - i, u = f * f * (3 - 2 * f); return NT[i & 1023] * (1 - u) + NT[(i + 1) & 1023] * u; };
const fbm = (x, o = 3) => { let s = 0, a = .5, n = 0; for (let i = 0; i < o; i++) { s += a * n1(x); n += a; x = x * 2.03 + 17.1; a *= .5; } return s / n; };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

const INK = [26, 24, 22], PALE = [58, 72, 84], GREEN = [42, 62, 50], RED = [186, 44, 34],
      PINK = [222, 124, 136], OCHRE = [198, 146, 38];
const FONT = '"Mo Brush","Xingkai SC","STXingkai","华文行楷","Kaiti SC","STKaiti","KaiTi","楷体",serif';
const Q = new URLSearchParams(location.search);
const FAST = Q.has('fast');
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* 纸色跟随站点主题（2026-11-25）：父页开纸面时带 ?paper=#rrggbb（当前 --bg），
   纸、题跋留白、底部白纱全部用同一底色，纸从 header 底下滑下来时没有接缝。
   直接访问 /paint 时用站点默认底色兜底。 */
const PAPER_HEX = /^#[0-9a-f]{6}$/i.test(Q.get('paper') || '') ? Q.get('paper').toLowerCase() : '#f7f7fb';
const PAPER = [parseInt(PAPER_HEX.slice(1, 3), 16), parseInt(PAPER_HEX.slice(3, 5), 16), parseInt(PAPER_HEX.slice(5, 7), 16)];
document.documentElement.style.setProperty('--paper', PAPER_HEX);
document.documentElement.style.setProperty('--paper-rgb', PAPER.join(','));

const cv = {}, cx = {};
for (const k of ['paper', 'far', 'mid', 'near', 'live', 'text']) { cv[k] = $('#' + k); cx[k] = cv[k].getContext('2d'); }
const stage = $('#stage'), intro = $('#intro');

/* ───────────── 场景状态 ───────────── */
const S = { W: 0, H: 0, dpr: 1, u: 1, horizon: 0, seed: Math.random() };
function resetState() {
  Object.assign(S, {
    nMount: 0, mounts: [], bank: { L: { used: 0, painted: false }, R: { used: 0, painted: false } }, bseed: rand(100),
    sun: null, moon: null, water: 0, ground: 0, snowSky: false, rainSky: false,
    birds: [], fish: [], boats: [], strands: [], petals: [], emitters: [], ripples: [], shimmer: [], puffs: [],
    stars: [], lights: [], gusts: [], flies: [], drops: [], flakes: [], flour: [],
    dragons: [], bolts: [], meteors: [], sparks: [], lanterns: [], kites: [], dflies: [], smokes: [], falls: [], flags: [], frogs: [], chims: [],
    bow: null, vines: 0, dunes: 0,
    rainEnd: 0, snowEnd: 0, leafEnd: 0, windEnd: 0, windStart: 0, windDir: 1,
    insc: [], idx: 0, lastFig: -99, lastFigBoat: null, lastFigPos: null,
    lastType: 0, sealOn: false, sealT: 0, textUntil: 0, textFinal: true,
  });
  resetSky();
}
function resetSky() { S.sky = new Float32Array(ceil(S.W / 4) + 2).fill(S.H * 2); S.skyP = null; }
const skyAt = x => S.sky[clamp(round(x / 4), 0, S.sky.length - 1)];
function lowerSky(ridge) {
  for (let i = 0; i < ridge.length - 1; i++) {
    const a = ridge[i], b = ridge[i + 1];
    for (let k = ceil(a[0] / 4); k <= floor(b[0] / 4); k++) {
      if (k < 0 || k >= S.sky.length) continue;
      const y = lerp(a[1], b[1], (k * 4 - a[0]) / ((b[0] - a[0]) || 1));
      if (y < S.sky[k]) S.sky[k] = y;
    }
  }
  S.skyP = null;
}
function skyClip(g) {
  if (!S.skyP) {
    const p = new Path2D(); p.moveTo(-20, -20); p.lineTo(-20, min(S.sky[0], S.H + 20));
    for (let k = 0; k < S.sky.length; k++) p.lineTo(k * 4, min(S.sky[k], S.H + 20));
    p.lineTo(S.W + 20, min(S.sky[S.sky.length - 1], S.H + 20)); p.lineTo(S.W + 20, -20); p.closePath();
    S.skyP = p;
  }
  g.clip(S.skyP);
}

/* ───────────── 宣纸 ───────────── */
function drawPaper() {
  const g = cx.paper, { W, H } = S;
  g.fillStyle = rgba(PAPER, 1); g.fillRect(0, 0, W, H);
  const t = document.createElement('canvas'); t.width = t.height = 256;
  const tg = t.getContext('2d'), id = tg.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = Math.random() < .5 ? 236 : 255;
    id.data[i] = v; id.data[i + 1] = v; id.data[i + 2] = v; id.data[i + 3] = Math.random() * 8;
  }
  tg.putImageData(id, 0, 0);
  g.fillStyle = g.createPattern(t, 'repeat'); g.fillRect(0, 0, W, H);
  for (let i = 0; i < 16; i++) {
    const x = rand(W), y = rand(H), r = rand(140, 460);
    const gr = g.createRadialGradient(x, y, 0, x, y, r), c = chance(.5) ? '110,110,110' : '255,255,255';
    gr.addColorStop(0, `rgba(${c},${rand(.02, .05)})`); gr.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  const nf = W * H / 800;
  for (let i = 0; i < nf; i++) {
    const x = rand(W), y = rand(H), a = rand(TAU), l = rand(4, 24);
    g.strokeStyle = chance(.6) ? `rgba(255,255,255,${rand(.1, .3)})` : `rgba(100,100,100,${rand(.03, .1)})`;
    g.lineWidth = rand(.3, .9); g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + cos(a) * l * .5 + rand(-3, 3), y + sin(a) * l * .5 + rand(-3, 3), x + cos(a) * l, y + sin(a) * l); g.stroke();
  }
  /* 四边暗角已去掉（2026-11-25）：纸色和站点底色一致时，任何沿边的压暗都会显出一圈灰框，
     看起来还是「贴了一张纸」。纸感靠上面的纤维和墨团，不靠边框。 */
}

function resize(first) {
  const W = innerWidth, H = innerHeight, dpr = min(2, devicePixelRatio || 1);
  const sx = W / (S.W || W), sy = H / (S.H || H), keep = {};
  if (!first) for (const k of ['far', 'mid', 'near']) {
    const t = document.createElement('canvas'); t.width = cv[k].width; t.height = cv[k].height;
    t.getContext('2d').drawImage(cv[k], 0, 0); keep[k] = t;
  }
  S.W = W; S.H = H; S.dpr = dpr; S.u = clamp(min(W, H) / 860, .5, 1.3); S.horizon = H * .7;
  S.floor = max(H * .78, min(H - 60, $('#ui').getBoundingClientRect().top - 14));   // 水面元素的下界：输入区上沿
  for (const k in cv) { cv[k].width = round(W * dpr); cv[k].height = round(H * dpr); cx[k].setTransform(dpr, 0, 0, dpr, 0, 0); }
  drawPaper();
  if (first) return;
  for (const k in keep) cx[k].drawImage(keep[k], 0, 0, W, H);
  for (const L of [S.birds, S.fish, S.boats, S.strands, S.petals, S.emitters, S.ripples, S.shimmer, S.puffs, S.stars, S.lights, S.flies,
    S.dragons, S.lanterns, S.kites, S.dflies, S.smokes, S.falls, S.flags, S.frogs, S.chims])
    for (const o of L) { if (o.x !== undefined) { o.x *= sx; o.y *= sy; } if (o.by !== undefined) o.by *= sy; if (o.hx !== undefined) { o.hx *= sx; o.hy *= sy; } }
  for (const m of S.mounts) for (const p of m.ridge) { p[0] *= sx; p[1] *= sy; }
  for (const c of [S.sun, S.moon]) if (c) { c.x *= sx; c.y *= sy; }
  resetSky(); for (const m of S.mounts) if (m.kind !== 'far') lowerSky(m.ridge);
  S.textUntil = performance.now() + 100; S.textFinal = false;
}

/* ───────────── 任务调度（生成器即笔序） ───────────── */
let tasks = [], TK = 0;   // TK：已走过的笔序帧数，用来等前一笔墨干
const run = g => (tasks.push(g), g);
function tick() {
  TK++;
  tasks = tasks.filter(t => { try { return !t.next().done; } catch (e) { console.error(e); return false; } });
}
function* par(...gs) { gs = gs.filter(Boolean); while (gs.length) { gs = gs.filter(g => !g.next().done); if (gs.length) yield; } }
function* seq(...gs) { for (const g of gs) if (g) yield* g; }
function* wait(n) { while (n-- > 0) yield; }
function* pool(list, k = 3) {
  const act = []; let i = 0;
  for (;;) {
    while (act.length < k && i < list.length) act.push(list[i++]);
    for (let j = act.length - 1; j >= 0; j--) if (act[j].next().done) act.splice(j, 1);
    if (!act.length && i >= list.length) return;
    yield;
  }
}

/* ───────────── 笔墨基元 ───────────── */
function smooth(pts, step) {
  const out = [], n = pts.length;
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const m = max(1, ceil(hypot(p2[0] - p1[0], p2[1] - p1[1]) / step));
    for (let k = 0; k < m; k++) {
      const t = k / m, t2 = t * t, t3 = t2 * t;
      out.push([
        .5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]);
    }
  }
  out.push([pts[n - 1][0], pts[n - 1][1]]);
  return out;
}
function resample(pts, step) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], m = max(1, ceil(hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let k = 0; k < m; k++) out.push([lerp(a[0], b[0], k / m), lerp(a[1], b[1], k / m)]);
  }
  out.push(pts[pts.length - 1]);
  return out;
}
/* 毛笔：由多根“笔毫”组成，干处留飞白 */
function* brush(g, pts, o = {}) {
  const w = o.w ?? 5, ink = o.ink ?? .8, dry = o.dry ?? .25, color = o.color || INK, speed = o.speed ?? 10,
        tin = o.tin ?? .12, tout = o.tout ?? .3, step = o.step ?? 2;
  const path = o.linear ? resample(pts, step) : smooth(pts, step), n = path.length;
  if (n < 2) return;
  const K = clamp(round(w / 1.4), 1, 22), seed = rand(1000), br = [];
  for (let j = 0; j < K; j++) {
    const f = K === 1 ? 0 : j / (K - 1) - .5;
    br.push({ off: f * (1 + rand(-.06, .06)), a: ink * (K === 1 ? 1 : rand(.5, 1)), seed: rand(1000), edge: abs(f) * 2 });
  }
  const nx = new Float32Array(n), ny = new Float32Array(n), ww = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const a = path[max(0, i - 1)], b = path[min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = hypot(dx, dy) || 1;

    const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(226,104,36,${.55 * fl})`); gr.addColorStop(1, 'rgba(226,104,36,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.fillStyle = 'rgba(196,48,28,.9)'; g.beginPath(); g.arc(x, y, 1.8 * u, 0, TAU); g.fill();
  }

  drawLive2(g, now, k, wind);

  // 落字
  S.flour = S.flour.filter(f => {
    const p = (now - f.t0) / f.dur;
    if (p >= 1) { if (f.ghost) drawGlyph(cx.far, f, f.ghost, 28, 1.02); return false; }
    const a = p < .14 ? p / .14 * .8 : lerp(.8, f.ghost, ease((p - .14) / .86));
    drawGlyph(g, f, a, 2 + 26 * p, .92 + .1 * ease(p)); return true;
  });
}

/* ───────────── 主循环 ───────────── */
let last = performance.now(), acc = 0;
let exporting = false;   // 存画编码期间冻结动画：让出主线程，toBlob 才不会被拖几秒
function frame(now) {
  const dt = min(100, now - last); last = now;
  if (exporting) { requestAnimationFrame(frame); return; }   // 空转保留 rAF，恢复时不跳帧
  acc += dt;
  let n = 0; const quick = CALM || FAST, cap = quick ? 40 : 3;
  while ((acc >= 16.6 || quick) && n < cap) { tick(); acc -= 16.6; n++; }
  if (acc > 50 || quick) acc = 0;
  drawLive(now, dt);
  const want = S.insc.some(c => c.length) && now - S.lastType > 1700 && !queue.length;
  if (want !== S.sealOn) { S.sealOn = want; S.sealT = now; S.textUntil = now + 500; S.textFinal = false; }
  if (now < S.textUntil) drawText(now); else if (!S.textFinal) { drawText(now); S.textFinal = true; }
  requestAnimationFrame(frame);
}

/* ───────────── 交互 ───────────── */
/* 输入框已去（2026-11-23 站长改）：入画只靠点字（chips 全集），Esc 保留「换纸」快捷 */
// Esc 换纸；但正在题诗输入框里按 Esc 只是想退出输入，不该把整张画清掉
addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) { e.target.blur(); return; }
  newPaper();
});

let clearing = false;
function newPaper(then) {
  if (clearing) return; clearing = true; queue = []; stage.classList.add('fade');
  setTimeout(() => {
    for (const k of ['far', 'mid', 'near', 'live', 'text']) cx[k].clearRect(0, 0, S.W, S.H);
    tasks = []; resetState(); stage.classList.remove('fade'); clearing = false;
    if (then) setTimeout(then, 500);
  }, 880);
}
const POEMS = ['孤舟蓑笠翁，独钓寒江雪', '明月松间照，清泉石上流', '枯藤老树昏鸦，小桥流水人家', '两个黄鹂鸣翠柳，一行白鹭上青天',
  '落霞与孤鹜齐飞，秋水共长天一色', '竹外桃花三两枝，春江水暖鸭先知', '山气日夕佳，飞鸟相与还', '接天莲叶无穷碧，映日荷花别样红',
  '大漠孤烟直，长河落日圆', '飞流直下三千尺，疑是银河落九天', '小荷才露尖尖角，早有蜻蜓立上头', '儿童散学归来早，忙趁东风放纸鸢',
  '稻花香里说丰年，听取蛙声一片', '千里莺啼绿映红，水村山郭酒旗风'];
let poemI = floor(rand(POEMS.length));
$('#btn-new').onclick = () => newPaper();
$('#btn-poem').onclick = () => { const p = POEMS[poemI++ % POEMS.length]; intro.classList.add('gone'); newPaper(() => typeText(p)); };
/* 合成当前画面（存画与设壁纸共用）：纸 + 远中近 + 笔迹 + 题字，乘法叠出成片 */
function composite() {
  const c = document.createElement('canvas'); c.width = cv.paper.width; c.height = cv.paper.height; const g = c.getContext('2d');
  g.drawImage(cv.paper, 0, 0); g.globalCompositeOperation = 'multiply'; for (const k of ['far', 'mid', 'near']) g.drawImage(cv[k], 0, 0);
  g.globalCompositeOperation = 'source-over'; g.drawImage(cv.live, 0, 0); g.globalCompositeOperation = 'multiply'; g.drawImage(cv.text, 0, 0);
  return c;
}
/* 存画（2026-11-24）：异步 toBlob 编码，不再同步 toDataURL + atob 逐字节拷贝。
   编码前先冻结动画把主线程让出来（上面的 exporting），否则 toBlob 回调会被动画拖几秒。
   blob 直接给 URL.createObjectURL，省掉 base64 解码和逐字节循环，大图也不卡界面。 */
$('#btn-save').onclick = () => {
  if (exporting) return;   // 防连点：上一张还没编码完
  exporting = true;
  const c = composite();
  c.toBlob(blob => {
    exporting = false;
    if (!blob) return;   // 浏览器极端情况下编码失败，静默放过
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = '落笔成画.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);   // 慢设备下载写盘慢，留足时间再撤 URL
  }, 'image/png');
};
/* 设为壁纸（2026-11-25 改透明墨层）：按钮不在本页——父页纸面右上角（app.js），这里只听指令合成回传。
   纸不再是白的：按「与纸色的亮度差」逐像素算 alpha，纯纸变全透明、墨越浓越实，
   站点底色 / 纸纹 / 主题光晕从画里直接透上来，换主题自动融合，四边也不再有白框。
   带 alpha 的 WebP 通常比原来的 JPEG 还小；浏览器不支持 WebP 编码时回落 PNG。 */
if (window.parent !== window) addEventListener('message', e => {
  if (e.source !== window.parent || !e.data || e.data.type !== 'dm-paint-wall-req') return;
  const c = composite(), MAXW = 1920;
  const w = c.width > MAXW ? MAXW : c.width, h = round(c.height * w / c.width);
  const s = document.createElement('canvas'); s.width = w; s.height = h;
  const sg = s.getContext('2d');
  sg.drawImage(c, 0, 0, w, h);
  const id = sg.getImageData(0, 0, w, h), d = id.data;
  const pl = PAPER[0] * .299 + PAPER[1] * .587 + PAPER[2] * .114;
  for (let i = 0; i < d.length; i += 4) {
    const lum = d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114;
    const a = (pl - lum) / pl * 255 * 1.35;   // 1.35：补一点淡墨层次，雾和远山不至于全透明
    d[i + 3] = a <= 12 ? 0 : a >= 255 ? 255 : a;   // ≤12 判为纸纹/压缩底噪，整片清掉，壁纸不留灰雾
  }
  sg.putImageData(id, 0, 0);
  let data = '';
  try { data = s.toDataURL('image/webp', .86); } catch { /* 老浏览器不支持 webp 编码 */ }
  if (data.indexOf('data:image/webp') !== 0) data = s.toDataURL('image/png');
  parent.postMessage({ type: 'dm-paint-wallpaper', data }, e.origin);
});
const chips = $('#chips');
/* 全字 chips（2026-11-23）：M 是 def 注册的「一字一景」映射，引擎认得多少字就列多少；
   Set 去重（虹/瀑 这类二次注册的只留一处），顺序 = def 注册顺序；
   换景函数变化处（山水→日月→云雾→鸟兽→草木→建筑→人物…）留一点间距，找字不用瞪 */
{
  let prevFn;
  for (const c of new Set(Object.keys(M))) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = c;
    if (prevFn && M[c] !== prevFn) b.style.marginLeft = '12px';
    prevFn = M[c];
    b.onclick = () => typeText(c); chips.appendChild(b);
  }
}

/* AI 题诗（2026-11-25）：输入 ≤10 个字 → 服务端用它拼一首五言/七言绝句 → 逐句落墨。
   提示词里带了字库认得的意象字，生成的句子基本每个字都能落成景；进度/失败都写在输入条上方的小字里
   （不再改 placeholder——框里有字时那个提示是隐形的），失败不动画布、不弹窗（纸面上弹东西最出戏）。 */
const poemSeed = $('#poemSeed'), poemBtns = [...document.querySelectorAll('.poem-go')], poemMsg = $('#poemMsg');
let poemBusy = false, poemMsgTimer = 0;
// hold 给「会自己消失」的提示用（成功/失败都停一会儿，别一直挂在那）
function poemSay(text, kind, hold) {
  clearTimeout(poemMsgTimer);
  if (!text) { poemMsg.textContent = ''; poemMsg.classList.remove('on', 'info'); return; }
  poemMsg.textContent = text;
  poemMsg.classList.toggle('info', kind === 'info');
  poemMsg.classList.add('on');
  if (hold) poemMsgTimer = setTimeout(() => { poemMsg.textContent = ''; poemMsg.classList.remove('on', 'info'); }, hold);
}
// 中文输入法在组字（拼音还没上屏）时 input 会连着触发，这时改写 value 会把组字打断，
// 表现就是「打不出字 / 输不进去」，所以组字期间一律不动 value（11-25 用户反馈重新输入不了）。
let poemComposing = false;
function poemNormalize() {
  const v = poemSeed.value.replace(/\s+/g, '').slice(0, 10);
  if (v !== poemSeed.value) poemSeed.value = v;
}
poemSeed.addEventListener('compositionstart', () => { poemComposing = true; });
poemSeed.addEventListener('compositionend', () => { poemComposing = false; poemNormalize(); });
poemSeed.addEventListener('input', e => { if (poemComposing || e.isComposing) return; poemNormalize(); });
poemSeed.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); startPoem(5); } });
poemBtns.forEach(b => { b.onclick = () => startPoem(Number(b.dataset.form)); });
async function startPoem(form) {
  if (poemBusy) return;
  const seed = poemSeed.value.replace(/[^\u3400-\u9fff]/g, '').slice(0, 10);
  if (!seed) { poemSay('先输入一两个字，再题诗', 'warn', 2600); poemSeed.focus(); return; }
  poemBusy = true;
  const hit = poemBtns.find(b => b.dataset.form === String(form));
  const labels = poemBtns.map(b => b.textContent);
  poemBtns.forEach(b => { b.disabled = true; });
  if (hit) hit.textContent = '落笔中…';
  poemSay('正在题诗，十几秒就好…', 'info');
  // 前端自己也设一道闸：服务端 18s 会回 504，这里多留几秒兜住「连接挂住不回」
  const ctrl = new AbortController();
  const cut = setTimeout(() => ctrl.abort(), 26000);
  try {
    const r = await fetch('/api/paint/poem', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seed, form }), signal: ctrl.signal
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !Array.isArray(j.lines) || j.lines.length < 2) throw new Error(j.error || 'AI 没接上，等会儿再试');
    poemSeed.value = '';
    poemSay('');
    intro.classList.add('gone');
    newPaper(() => typeText(j.lines.join('，') + '。'));
  } catch (err) {
    const msg = err && err.name === 'AbortError' ? '等了太久，AI 没回话，再点一次' : String((err && err.message) || '题诗没成功，再试一次');
    poemSay(msg.slice(0, 40), 'warn', 6000);
  } finally {
    clearTimeout(cut);
    poemBusy = false;
    poemBtns.forEach((b, i) => { b.disabled = false; b.textContent = labels[i]; });
  }
}

/* 以指为笔：拖动成干笔，点按落墨 */
let stroke = null;
stage.addEventListener('pointerdown', e => {
  stroke = { x: e.clientX, y: e.clientY, w: 4 * S.u, moved: 0, nx: 0, ny: 0, seeds: Array.from({ length: 12 }, () => rand(1000)), al: Array.from({ length: 12 }, () => rand(.4, .85)) };
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  if (e.pointerType === 'mouse') e.preventDefault();
});
stage.addEventListener('pointermove', e => {
  if (!stroke) return;
  const dx = e.clientX - stroke.x, dy = e.clientY - stroke.y, d = hypot(dx, dy); if (d < 2.5) return;
  if (stroke.moved < 6 && stroke.moved + d >= 6) intro.classList.add('gone');
  const g = cx.near, w0 = stroke.w, w1 = lerp(w0, clamp(17 - d * .45, 3, 17) * S.u, .25), nx = -dy / d, ny = dx / d, K = 12;
  const px = stroke.moved ? stroke.nx : nx, py = stroke.moved ? stroke.ny : ny;
  g.save(); g.lineCap = 'round'; g.lineWidth = 1.7;
  for (let j = 0; j < K; j++) {
    if (n1(stroke.seeds[j] + stroke.moved * .03) < .26 + abs(j / (K - 1) - .5) * .3) continue;
    const o = j / (K - 1) - .5; g.strokeStyle = rgba(INK, stroke.al[j]); g.beginPath();
    g.moveTo(stroke.x + px * o * w0, stroke.y + py * o * w0); g.lineTo(e.clientX + nx * o * w1, e.clientY + ny * o * w1); g.stroke();
  }
  g.restore();
  Object.assign(stroke, { x: e.clientX, y: e.clientY, w: w1, nx, ny, moved: stroke.moved + d });
});
const endStroke = e => {
  if (!stroke) return;
  if (stroke.moved < 5) {
    const x = e.clientX, y = e.clientY, R = rand(14, 30) * S.u; intro.classList.add('gone');
    run(bloom(cx.near, x, y, R, { alpha: .36, frames: 46, rim: true })); run(splatter(cx.near, x, y, R * 2.4, 9));
    if (y > S.horizon) ripple(x, y, 60 * S.u, .4);
  }
  stroke = null;
};
stage.addEventListener('pointerup', endStroke); stage.addEventListener('pointercancel', endStroke);

let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => resize(false), 180); });

/* ───────────── 启动 ───────────── */
resize(true); resetState();
if (FAST) intro.style.display = 'none';
requestAnimationFrame(frame);
const ready = document.fonts && document.fonts.load ? Promise.race([document.fonts.load('40px "Mo Brush"', '落笔成画'), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
ready.catch(() => {}).then(() => {
  S.textUntil = performance.now() + 200; S.textFinal = false;
  const t = Q.get('t'); if (t) typeText(t);
});
})();
</script>
</body>
